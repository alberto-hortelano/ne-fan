<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Packs de estilo — staging para aprobación</title>
  <style>
    body { background: #14141a; color: #ccc; font: 14px system-ui, sans-serif; margin: 24px; }
    h1 { color: #da6; font-size: 22px; }
    h2 { color: #bbb; margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; }
    figure { margin: 0; background: #1b1b22; border: 1px solid #2a2a30; border-radius: 6px; padding: 10px; }
    img { width: 100%; display: block; border-radius: 3px; }
    figcaption { margin-top: 8px; font-size: 13px; color: #9a9; }
    figcaption code { color: #da6; }
    p.nota { color: #888; max-width: 900px; }
  </style>
</head>
<body>
  <h1>Refs de estilo en staging (pendientes de aprobación)</h1>
  <p class="nota">
    Generadas con la plantilla clay + gpt-image-2. Aprobar una = copiarla al pack
    del estilo (sus refs ya están declaradas en style.json). Regenerar cuesta
    ~0,17 $ la imagen. ?style=&lt;id&gt; cambia de estilo (default medievo_crudo).
  </p>
  <h2 id="titulo"></h2>
  <div class="grid" id="refs"></div>
  <script>
    const style = new URLSearchParams(location.search).get("style") || "medievo_crudo";
    document.getElementById("titulo").textContent = `_staging/${style}`;
    const cats = ["stage_street", "stage_plaza", "stage_interior", "stage_nature", "stage_harbor", "stage_gate"];
    const el = document.getElementById("refs");
    for (const c of cats) {
      const fig = document.createElement("figure");
      const src = `/nefan-core/data/styles/_staging/${style}/${c}.jpg`;
      fig.innerHTML = `<img src="${src}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption><code>${c}</code></figcaption>`;
      el.appendChild(fig);
    }
  </script>
</body>
</html>
