<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Calle mayor curva, atardecer. Horizonte y=400, fuga ~(1010,400) oculta por la curva. Sol bajo desde el OESTE (izquierda). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e8fb8"/>
      <stop offset="0.55" stop-color="#a9bcc6"/>
      <stop offset="0.85" stop-color="#e3d3b2"/>
      <stop offset="1" stop-color="#f2ddb4"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ffd98e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd98e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eadfc6" stop-opacity="0"/>
      <stop offset="1" stop-color="#eadfc6" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8d7f6e"/>
      <stop offset="0.55" stop-color="#a4937c"/>
      <stop offset="1" stop-color="#cdb896"/>
    </linearGradient>
    <linearGradient id="litwall" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9ba8c"/>
      <stop offset="0.6" stop-color="#e8d2a8"/>
      <stop offset="1" stop-color="#f0dfba"/>
    </linearGradient>
    <linearGradient id="puddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d9b4"/>
      <stop offset="1" stop-color="#9fb2c0"/>
    </linearGradient>
    <clipPath id="streetclip">
      <path d="M 100,1000 C 470,770 760,590 950,472 L 1060,452 C 1060,452 1075,505 1090,555 C 1120,660 1200,830 1290,1000 Z"/>
    </clipPath>
  </defs>

  <!-- ======== CIELO Y FONDO MATTE ======== -->
  <rect x="0" y="0" width="1600" height="470" fill="url(#sky)"/>
  <ellipse cx="170" cy="380" rx="420" ry="260" fill="url(#sunglow)"/>
  <path d="M 90,150 q 140,-18 300,-8 q 180,10 320,-6 q 60,-6 120,2 l 4,10 q -160,14 -330,10 q -220,-4 -410,6 z" fill="#dfe6ea" opacity="0.5"/>
  <path d="M 700,225 q 200,-14 400,-4 q 140,6 240,-6 l 3,9 q -170,16 -380,10 q -150,-4 -260,2 z" fill="#e8e3d5" opacity="0.45"/>
  <!-- colinas lejanas, dos crestas -->
  <path d="M 0,392 q 180,-34 350,-22 q 190,12 340,-8 q 240,-30 470,-10 q 250,20 440,4 l 0,80 l -1600,0 z" fill="#9fb0c1" opacity="0.85"/>
  <path d="M 0,410 q 260,-26 480,-10 q 260,18 520,2 q 320,-18 600,6 l 0,60 l -1600,0 z" fill="#b4c0c6" opacity="0.9"/>
  <!-- caserío lejano tras el codo (siluetas pálidas) -->
  <g fill="#c8bba6" opacity="0.9">
    <polygon points="820,420 820,382 848,368 876,382 876,420"/>
    <polygon points="870,420 870,374 902,360 934,374 934,420"/>
    <polygon points="1080,420 1080,378 1108,364 1136,378 1136,420"/>
    <polygon points="1130,424 1130,388 1152,376 1174,388 1174,424"/>
  </g>
  <g fill="#b7a892" opacity="0.9">
    <polygon points="836,382 848,368 860,382"/>
    <polygon points="886,374 902,360 918,374"/>
    <polygon points="1094,378 1108,364 1122,378"/>
  </g>

  <!-- FOCO: torre de la iglesia sobre el codo, dorada por el sol bajo -->
  <g>
    <polygon points="985,330 985,166 1045,166 1045,330" fill="#a3907a"/>
    <polygon points="985,330 985,166 1013,166 1013,330" fill="#dcb886"/>
    <rect x="996" y="182" width="14" height="26" rx="7" fill="#4a3d33"/>
    <rect x="1020" y="182" width="14" height="26" rx="7" fill="#3a3029"/>
    <rect x="980" y="162" width="70" height="8" fill="#8a7660"/>
    <polygon points="976,162 1015,112 1054,162" fill="#9c5a44"/>
    <polygon points="976,162 1015,112 1015,162" fill="#c37b55"/>
    <line x1="1015" y1="112" x2="1015" y2="96" stroke="#5b4a3c" stroke-width="3"/>
    <circle cx="1015" cy="92" r="5" fill="none" stroke="#5b4a3c" stroke-width="3"/>
    <circle cx="1006" cy="246" r="13" fill="#e8dcc2" stroke="#6b5a48" stroke-width="2"/>
    <line x1="1006" y1="246" x2="1006" y2="237" stroke="#6b5a48" stroke-width="2"/>
    <line x1="1006" y1="246" x2="1012" y2="248" stroke="#6b5a48" stroke-width="2"/>
  </g>

  <!-- calima sobre el fondo -->
  <rect x="0" y="240" width="1600" height="200" fill="url(#haze)"/>

  <!-- ======== CALLE (superficie) ======== -->
  <path d="M 100,1000 C 470,770 760,590 950,472 L 1060,452 C 1060,452 1075,505 1090,555 C 1120,660 1200,830 1290,1000 Z" fill="url(#street)"/>

  <!-- ======== CASA DEL CODO (cierra la calle, cara al sol) ======== -->
  <g>
    <polygon points="926,474 926,336 1046,326 1046,470" fill="#dbc19b"/>
    <polygon points="1046,326 1046,470 1092,462 1092,332" fill="#a58a6c"/>
    <polygon points="914,338 996,276 1104,330 1046,326 926,336" fill="#b06a4c"/>
    <polygon points="1046,326 1104,330 996,276 1028,328" fill="#8a4f3c"/>
    <g stroke="#7a5a3c" stroke-width="3.5" opacity="0.85">
      <line x1="926" y1="402" x2="1046" y2="398"/>
      <line x1="986" y1="334" x2="986" y2="472"/>
    </g>
    <rect x="942" y="356" width="24" height="32" fill="#3c3128" stroke="#8a6a4a" stroke-width="2"/>
    <rect x="1002" y="352" width="24" height="32" fill="#463a2e" stroke="#8a6a4a" stroke-width="2"/>
    <path d="M 1000,472 l 0,-48 a 20,20 0 0 1 40,0 l 0,48 z" fill="#2e241c"/>
    <rect x="926" y="336" width="120" height="8" fill="#8a6f52" opacity="0.6"/>
  </g>

  <!-- ropa tendida cruzando hacia la casa del codo -->
  <g>
    <path d="M 836,388 q 70,26 150,8" stroke="#5c5248" stroke-width="2.5" fill="none"/>
    <path d="M 856,394 q 5,16 12,0 z" fill="#dbd6c6"/>
    <path d="M 886,400 q 6,18 13,0 z" fill="#b9a498"/>
    <path d="M 920,403 q 6,16 12,0 z" fill="#ccd2c4"/>
    <path d="M 952,400 q 5,14 11,0 z" fill="#dbd6c6"/>
  </g>

  <!-- ======== MURO DERECHO CONTINUO EN FUGA (fachadas doradas) ======== -->
  <g>
    <!-- pano completo: base = borde derecho de la calle; remate = hastial lejano + alero que sube y sale de cuadro -->
    <polygon points="1060,452 1075,505 1090,555 1120,660 1200,830 1290,1000 1600,1000 1600,0 1252,0 1188,142 1120,96 1052,150 1052,452" fill="url(#litwall)"/>
    <!-- hastial de la casa lejana -->
    <polygon points="1052,150 1120,96 1188,142" fill="#c8815c"/>
    <polygon points="1052,150 1120,96 1120,150" fill="#e09a6a"/>
    <!-- alero de teja descendiendo hacia el hastial -->
    <polygon points="1252,0 1188,142 1172,136 1230,-14" fill="#b06a4c"/>
    <path d="M 1244,6 L 1184,140" stroke="#8a4f3c" stroke-width="4" opacity="0.8"/>
    <!-- esquinas verticales entre casas -->
    <line x1="1188" y1="142" x2="1188" y2="508" stroke="#b08a5e" stroke-width="4" opacity="0.7"/>
    <line x1="1200" y1="830" x2="1214" y2="0" stroke="#b08a5e" stroke-width="5" opacity="0.55"/>
    <!-- variación de tono entre casas -->
    <polygon points="1200,830 1290,1000 1600,1000 1600,0 1252,0 1214,0" fill="#d3ae7e" opacity="0.30"/>
    <polygon points="1090,555 1120,660 1200,830 1214,0 1188,142 1188,508" fill="#e8cfa2" opacity="0.35"/>
    <!-- división de plantas: banda de sombra bajo el vuelo del piso superior -->
    <path d="M 1062,388 C 1130,320 1240,230 1370,110 L 1600,-90 L 1600,-120 L 1360,88 C 1230,208 1120,300 1058,368 Z" fill="#b8946a" opacity="0.22"/>
    <path d="M 1060,420 C 1150,470 1290,560 1460,680 L 1600,780 L 1600,806 L 1450,700 C 1284,580 1146,488 1058,440 Z" fill="#b8946a" opacity="0.4"/>
    <!-- ventanas con marco y contraventanas, creciendo hacia cámara -->
    <g>
      <rect x="1130" y="292" width="34" height="56" fill="#42362b" stroke="#8a6a4a" stroke-width="3"/>
      <rect x="1122" y="292" width="8" height="56" fill="#7c5a44"/>
      <rect x="1226" y="206" width="46" height="76" fill="#3c3128" stroke="#8a6a4a" stroke-width="3"/>
      <rect x="1214" y="206" width="11" height="76" fill="#7c5a44"/>
      <rect x="1273" y="206" width="11" height="76" fill="#7c5a44"/>
      <rect x="1352" y="98" width="58" height="94" fill="#42362b" stroke="#8a6a4a" stroke-width="4"/>
      <rect x="1338" y="98" width="13" height="94" fill="#7c5a44"/>
      <rect x="1411" y="98" width="13" height="94" fill="#7c5a44"/>
      <rect x="1496" y="0" width="70" height="80" fill="#3c3128" stroke="#8a6a4a" stroke-width="4"/>
      <rect x="1400" y="420" width="72" height="118" fill="#42362b" stroke="#8a6a4a" stroke-width="4"/>
      <rect x="1384" y="420" width="15" height="118" fill="#7c5a44"/>
      <rect x="1473" y="420" width="15" height="118" fill="#7c5a44"/>
      <rect x="1556" y="360" width="44" height="130" fill="#3c3128" stroke="#8a6a4a" stroke-width="4"/>
      <!-- ventanas bajas junto al codo -->
      <rect x="1104" y="470" width="30" height="46" fill="#3c3128" stroke="#8a6a4a" stroke-width="2.5"/>
      <rect x="1170" y="540" width="42" height="64" fill="#42362b" stroke="#8a6a4a" stroke-width="3"/>
      <!-- jardinera con geranios -->
      <rect x="1164" y="606" width="54" height="13" fill="#6b4f36"/>
      <g fill="#b8503c"><circle cx="1176" cy="601" r="6"/><circle cx="1192" cy="598" r="7"/><circle cx="1208" cy="601" r="6"/></g>
      <g fill="#5a7042"><circle cx="1184" cy="605" r="5"/><circle cx="1200" cy="605" r="5"/></g>
    </g>
    <!-- portón del taller en el pano cercano -->
    <path d="M 1300,1000 l 0,-160 a 70,64 0 0 1 140,0 l 0,160 z" fill="#4a3826"/>
    <path d="M 1310,1000 l 0,-152 a 60,55 0 0 1 120,0 l 0,152 z" fill="#332718"/>
    <line x1="1370" y1="790" x2="1370" y2="1000" stroke="#4a3826" stroke-width="5"/>
    <!-- rótulo colgante de la posada -->
    <g>
      <path d="M 1160,470 l -52,12" stroke="#3f342a" stroke-width="6" fill="none"/>
      <line x1="1116" y1="480" x2="1116" y2="506" stroke="#3f342a" stroke-width="3"/>
      <line x1="1148" y1="474" x2="1148" y2="502" stroke="#3f342a" stroke-width="3"/>
      <rect x="1104" y="504" width="56" height="42" rx="4" fill="#5c4330" stroke="#38291d" stroke-width="3"/>
      <circle cx="1132" cy="525" r="12" fill="#d9a24e"/>
    </g>
    <!-- línea de contacto del muro con el suelo -->
    <path d="M 1060,452 C 1075,505 1090,555 1120,660 C 1160,745 1225,880 1290,1000" stroke="#6b543c" stroke-width="6" fill="none" opacity="0.6"/>
  </g>

  <!-- ======== FILA IZQUIERDA: SOPORTALES A CONTRALUZ ======== -->
  <g>
    <polygon points="0,1000 0,0 620,0 620,120 780,270 900,376 952,438 950,472 100,1000" fill="#4c4038"/>
    <!-- faldón de teja a contraluz con hiladas -->
    <polygon points="620,120 780,270 900,376 952,438 966,430 912,352 800,240 660,96 620,96" fill="#6e5648"/>
    <path d="M 620,100 L 800,244 L 912,356 L 966,430" stroke="#e8a866" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 634,116 L 796,262 L 906,366 L 958,436" stroke="#5c463a" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 648,132 L 806,276 L 914,378 L 950,442" stroke="#5c463a" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- chimeneas sobre la cumbrera, con canto encendido -->
    <g>
      <polygon points="700,168 700,116 726,116 726,190" fill="#453a32"/>
      <line x1="726" y1="116" x2="726" y2="190" stroke="#d98f52" stroke-width="3" opacity="0.9"/>
      <rect x="694" y="108" width="38" height="10" fill="#3a302a"/>
      <polygon points="846,306 846,262 866,262 866,322" fill="#453a32"/>
      <line x1="866" y1="262" x2="866" y2="322" stroke="#d98f52" stroke-width="2.5" opacity="0.9"/>
      <rect x="841" y="255" width="30" height="9" fill="#3a302a"/>
    </g>
    <!-- arcos de los soportales (túnel en penumbra), decreciendo hacia el codo -->
    <g>
      <path d="M 118,988 l 0,-450 a 118,128 0 0 1 236,0 l 0,312 z" fill="#241d18"/>
      <path d="M 400,818 l 0,-330 a 86,96 0 0 1 172,0 l 0,236 z" fill="#241d18"/>
      <path d="M 606,690 l 0,-236 a 62,70 0 0 1 124,0 l 0,170 z" fill="#282019"/>
      <path d="M 756,592 l 0,-160 a 44,50 0 0 1 88,0 l 0,116 z" fill="#2c231b"/>
      <path d="M 862,520 l 0,-108 a 30,34 0 0 1 60,0 l 0,80 z" fill="#30261d"/>
    </g>
    <!-- filo de luz cálida en el canto derecho de cada pilar -->
    <g stroke="#d98f52" stroke-width="5" opacity="0.85">
      <line x1="354" y1="988" x2="354" y2="560"/>
      <line x1="572" y1="822" x2="572" y2="500"/>
      <line x1="730" y1="694" x2="730" y2="466"/>
      <line x1="844" y1="596" x2="844" y2="440"/>
      <line x1="922" y1="522" x2="922" y2="418"/>
    </g>
    <!-- fardos y barricas asomando del túnel -->
    <g>
      <ellipse cx="452" cy="806" rx="52" ry="20" fill="#1c1712"/>
      <rect x="412" y="740" width="80" height="66" rx="10" fill="#3a2e22"/>
      <path d="M 412,758 l 80,0" stroke="#20180f" stroke-width="4"/>
      <ellipse cx="648" cy="678" rx="34" ry="13" fill="#1c1712"/>
      <rect x="622" y="632" width="52" height="46" rx="8" fill="#3f3325"/>
      <circle cx="700" cy="664" r="22" fill="#332a20"/>
    </g>
  </g>

  <!-- banderolas de fiesta cruzando la calle -->
  <g>
    <path d="M 560,300 q 240,120 630,90" stroke="#4c443c" stroke-width="3" fill="none"/>
    <g opacity="0.95">
      <polygon points="640,342 660,346 646,376" fill="#b0563e"/>
      <polygon points="730,368 750,371 738,402" fill="#c8a23c"/>
      <polygon points="822,386 842,388 831,420" fill="#54756a"/>
      <polygon points="918,396 938,397 928,430" fill="#b0563e"/>
      <polygon points="1014,399 1034,399 1025,432" fill="#c8a23c"/>
      <polygon points="1106,396 1126,395 1118,428" fill="#54756a"/>
    </g>
  </g>

  <!-- humo de chimeneas -->
  <path d="M 713,112 q -16,-30 6,-54 q 22,-26 8,-54" stroke="#cfd4d6" stroke-width="9" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 856,258 q -12,-24 4,-44 q 16,-20 6,-40" stroke="#cfd4d6" stroke-width="7" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- ======== SUELO (recortado a la calzada) ======== -->
  <g clip-path="url(#streetclip)">
    <!-- sombra de la fila izquierda: corre A LO LARGO de la calle (sol al oeste),
         el borde converge hacia la fuga con dientes de chimeneas hacia el este -->
    <path d="M 60,1010 L 60,760 L 740,1000 L 900,1000
             C 800,880 760,830 700,760 L 760,748 L 690,682
             C 830,620 880,588 940,548 L 990,556 L 962,532
             L 1005,478 L 1060,452 L 950,472 C 760,590 470,770 100,1000 Z"
          fill="#33304e" opacity="0.34"/>
    <!-- charcos de luz colándose por los arcos del soportal -->
    <g fill="#eccf96" opacity="0.30">
      <ellipse cx="470" cy="920" rx="160" ry="42" transform="rotate(-9 470 920)"/>
      <ellipse cx="660" cy="790" rx="110" ry="30" transform="rotate(-10 660 790)"/>
      <ellipse cx="800" cy="690" rx="78" ry="21" transform="rotate(-11 800 690)"/>
      <ellipse cx="898" cy="614" rx="52" ry="15" transform="rotate(-11 898 614)"/>
      <ellipse cx="962" cy="556" rx="34" ry="10" transform="rotate(-12 962 556)"/>
    </g>
    <!-- regatón central curvo -->
    <path d="M 690,1000 C 810,800 930,610 1002,470" stroke="#6f6151" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 660,1000 C 790,796 918,608 996,468" stroke="#c9b892" stroke-width="4" fill="none" opacity="0.45"/>
    <!-- hiladas de adoquines convergiendo -->
    <g stroke="#6d5f50" fill="none" opacity="0.3">
      <path d="M 175,952 q 500,-140 1080,-24" stroke-width="5"/>
      <path d="M 300,872 q 440,-116 930,-28" stroke-width="5"/>
      <path d="M 415,800 q 390,-98 800,-30" stroke-width="4"/>
      <path d="M 520,738 q 340,-84 690,-30" stroke-width="4"/>
      <path d="M 615,682 q 300,-70 590,-28" stroke-width="3.5"/>
      <path d="M 700,634 q 250,-58 500,-26" stroke-width="3"/>
      <path d="M 772,592 q 210,-46 420,-22" stroke-width="2.5"/>
      <path d="M 836,556 q 170,-36 342,-18" stroke-width="2"/>
      <path d="M 890,526 q 130,-26 262,-14" stroke-width="1.6"/>
      <path d="M 928,502 q 100,-18 198,-10" stroke-width="1.3"/>
    </g>
    <!-- juntas radiales hacia la fuga (rejilla de adoquín) -->
    <g stroke="#6d5f50" fill="none" opacity="0.22">
      <path d="M 320,1000 C 560,800 800,620 990,478" stroke-width="4"/>
      <path d="M 980,1000 C 1010,800 1020,600 1016,472" stroke-width="4"/>
      <path d="M 1240,940 C 1130,740 1060,560 1040,464" stroke-width="4"/>
      <path d="M 120,900 C 420,720 720,560 964,466" stroke-width="4"/>
    </g>
    <!-- adoquines sueltos cerca de cámara -->
    <g fill="#7c6d5c" opacity="0.28">
      <ellipse cx="360" cy="930" rx="26" ry="9"/>
      <ellipse cx="580" cy="950" rx="28" ry="10"/>
      <ellipse cx="820" cy="912" rx="24" ry="9"/>
      <ellipse cx="990" cy="948" rx="26" ry="10"/>
      <ellipse cx="700" cy="850" rx="20" ry="7"/>
      <ellipse cx="1060" cy="860" rx="20" ry="7"/>
    </g>
    <!-- charco reflejando el cielo -->
    <ellipse cx="655" cy="770" rx="92" ry="20" fill="url(#puddle)" opacity="0.9"/>
    <ellipse cx="655" cy="770" rx="92" ry="20" fill="none" stroke="#5f5343" stroke-width="2" opacity="0.5"/>
    <polygon points="640,770 648,752 656,770 664,754 670,770" fill="#e8ddba" opacity="0.7"/>
  </g>

  <!-- ======== PRIMER TÉRMINO (enmarca, oscuro) ======== -->
  <!-- sombra del carro sobre la calle -->
  <ellipse cx="1330" cy="990" rx="240" ry="26" fill="#221e2e" opacity="0.5"/>
  <!-- carro con barricas, esquina inferior derecha, a contraluz -->
  <g>
    <polygon points="1250,842 1600,780 1600,1000 1290,1000" fill="#2f2820"/>
    <path d="M 1250,846 L 1600,784" stroke="#c98a50" stroke-width="5" fill="none" opacity="0.9"/>
    <circle cx="1400" cy="946" r="98" fill="#241d16"/>
    <circle cx="1400" cy="946" r="98" fill="none" stroke="#3d3226" stroke-width="14"/>
    <g stroke="#3d3226" stroke-width="9">
      <line x1="1400" y1="852" x2="1400" y2="1000"/>
      <line x1="1306" y1="946" x2="1494" y2="946"/>
      <line x1="1334" y1="880" x2="1466" y2="1000"/>
      <line x1="1466" y1="880" x2="1334" y2="1000"/>
    </g>
    <path d="M 1258,852 L 1130,900" stroke="#241d16" stroke-width="12" stroke-linecap="round"/>
    <g>
      <ellipse cx="1370" cy="796" rx="58" ry="42" fill="#33291e"/>
      <ellipse cx="1490" cy="772" rx="60" ry="44" fill="#2c2319"/>
      <path d="M 1318,790 q 52,-18 106,0" stroke="#c98a50" stroke-width="4" fill="none" opacity="0.8"/>
      <path d="M 1436,766 q 54,-18 110,0" stroke="#c98a50" stroke-width="4" fill="none" opacity="0.7"/>
      <line x1="1370" y1="754" x2="1370" y2="838" stroke="#1e1710" stroke-width="4"/>
      <line x1="1490" y1="728" x2="1490" y2="816" stroke="#1e1710" stroke-width="4"/>
    </g>
  </g>
  <!-- pilar del soportal, esquina inferior izquierda, cortado -->
  <g>
    <polygon points="0,1000 0,240 150,300 190,1000" fill="#332a22"/>
    <path d="M 152,306 L 190,1000" stroke="#d98f52" stroke-width="7" fill="none" opacity="0.9"/>
    <polygon points="0,930 210,900 226,1000 0,1000" fill="#3d332a"/>
    <circle cx="120" cy="640" r="18" fill="none" stroke="#171310" stroke-width="7"/>
    <circle cx="120" cy="612" r="7" fill="#171310"/>
  </g>

  <!-- vencejos -->
  <g stroke="#3f4650" stroke-width="3" fill="none" opacity="0.8">
