    <path d="M 1420,120 Q 1200,60 1010,110" stroke="#2c231a" stroke-width="34" fill="none"/>
    <path d="M 1240,86 q -60,-8 -120,10" stroke="#2c231a" stroke-width="18" fill="none"/>
    <g fill="#3e5232">
      <ellipse cx="1150" cy="130" rx="70" ry="30"/>
      <ellipse cx="1300" cy="110" rx="90" ry="36"/>
      <ellipse cx="1050" cy="150" rx="50" ry="24"/>
    </g>
    <g fill="#4a6338">
      <ellipse cx="1210" cy="120" rx="50" ry="22"/>
      <ellipse cx="1330" cy="100" rx="56" ry="24"/>
    </g>
  </g>

  <!-- ======== DOSEL OSCURO ======== -->
  <g>
    <path d="M 0,0 L 1600,0 L 1600,60 Q 1400,110 1200,86 Q 1000,66 800,96 Q 600,126 400,100 Q 200,76 0,120 Z" fill="#2e3320"/>
    <path d="M 200,60 Q 400,130 620,96 Q 560,150 420,146 Q 280,140 200,100 Z" fill="#3a4226" opacity="0.9"/>
    <path d="M 760,50 Q 960,120 1160,80 Q 1080,140 940,134 Q 820,126 760,90 Z" fill="#3a4226" opacity="0.85"/>
  </g>

  <!-- ======== HACES DE LUZ Y MOTAS ======== -->
  <g fill="#f6ecb4">
    <polygon points="430,0 530,0 900,700 780,700" opacity="0.13"/>
    <polygon points="640,0 700,0 1010,600 930,620" opacity="0.10"/>
    <polygon points="260,0 300,0 560,520 480,540" opacity="0.10"/>
  </g>
  <g fill="#eee2a0" opacity="0.5">
    <ellipse cx="600" cy="800" rx="46" ry="14"/>
    <ellipse cx="720" cy="740" rx="34" ry="10"/>
    <ellipse cx="500" cy="900" rx="56" ry="16"/>
    <ellipse cx="840" cy="704" rx="26" ry="8"/>
    <ellipse cx="900" cy="620" rx="20" ry="6"/>
    <ellipse cx="380" cy="960" rx="40" ry="12"/>
  </g>

  <!-- pájaros contra el claro -->
  <g stroke="#57604a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 700,260 q 9,-9 18,0 q 9,-9 18,0"/>
    <path d="M 780,300 q 7,-7 14,0 q 7,-7 14,0"/>
  </g>
</svg>
