<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Senda de bosque con puente. Horizonte y=420, fuga oculta por la S del camino. Claro dorado al fondo. Sol alto desde arriba-izquierda. -->
  <defs>
    <radialGradient id="claro" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f6e6a4"/>
      <stop offset="0.45" stop-color="#dccf8e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b8bc84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fondoBosque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa284"/>
      <stop offset="1" stop-color="#c2c298"/>
    </linearGradient>
    <linearGradient id="senda" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a7854"/>
      <stop offset="1" stop-color="#b3a072"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96b0a8"/>
      <stop offset="1" stop-color="#647e82"/>
    </linearGradient>
  </defs>

  <!-- ======== FONDO: bosque comido por la luz ======== -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#fondoBosque)"/>
  <ellipse cx="700" cy="400" rx="560" ry="420" fill="url(#claro)"/>
  <!-- cortina de troncos pálidos con sus copas difusas -->
  <g fill="#b0bc98" opacity="0.8">
    <ellipse cx="470" cy="150" rx="90" ry="55"/>
    <ellipse cx="620" cy="105" rx="110" ry="60"/>
    <ellipse cx="790" cy="90" rx="120" ry="62"/>
    <ellipse cx="950" cy="120" rx="100" ry="56"/>
    <ellipse cx="1060" cy="170" rx="80" ry="48"/>
  </g>
  <g fill="#a8b394" opacity="0.85">
    <polygon points="452,492 448,180 470,180 472,492"/>
    <polygon points="548,478 546,140 566,140 570,478"/>
    <polygon points="640,464 638,120 656,120 660,464"/>
    <polygon points="742,452 742,110 756,110 758,452"/>
    <polygon points="838,458 838,130 852,130 854,458"/>
    <polygon points="936,466 934,150 952,150 956,466"/>
    <polygon points="1030,478 1028,180 1048,180 1052,478"/>
  </g>
  <g fill="#98a488" opacity="0.7">
    <polygon points="500,486 498,220 510,220 512,486"/>
    <polygon points="700,458 700,160 710,160 712,458"/>
    <polygon points="892,462 890,170 900,170 902,462"/>
    <polygon points="984,470 982,200 994,200 996,470"/>
  </g>
  <!-- sombras de base para asentar los troncos lejanos -->
  <g fill="#98a082" opacity="0.6">
    <ellipse cx="461" cy="492" rx="26" ry="6"/>
    <ellipse cx="558" cy="478" rx="24" ry="6"/>
    <ellipse cx="649" cy="464" rx="22" ry="5"/>
    <ellipse cx="750" cy="452" rx="20" ry="5"/>
    <ellipse cx="846" cy="458" rx="20" ry="5"/>
    <ellipse cx="945" cy="466" rx="22" ry="5"/>
    <ellipse cx="1040" cy="478" rx="24" ry="6"/>
  </g>

  <!-- ======== TRONCOS MEDIOS ======== -->
  <g>
    <polygon points="360,520 348,60 402,60 398,520" fill="#6a5a44"/>
    <path d="M 356,400 q 14,-8 38,-4 M 352,300 q 16,-10 44,-6" stroke="#57493a" stroke-width="5" fill="none"/>
    <path d="M 398,520 l -8,-460 l 10,0 z" fill="#8a7452" opacity="0.8"/>
    <ellipse cx="380" cy="524" rx="60" ry="14" fill="#4e4634" opacity="0.5"/>
    <!-- rama baja rematada en fronda -->
    <path d="M 396,180 q 90,-30 180,-20" stroke="#6a5a44" stroke-width="16" fill="none"/>
    <g fill="#57744a">
      <ellipse cx="590" cy="150" rx="66" ry="30"/>
      <ellipse cx="530" cy="170" rx="46" ry="22"/>
    </g>
    <ellipse cx="600" cy="140" rx="40" ry="18" fill="#6e8858"/>
  </g>
  <g>
    <polygon points="1080,540 1068,20 1136,20 1130,540" fill="#615139"/>
    <path d="M 1076,420 q 20,-10 52,-6 M 1072,300 q 22,-12 58,-8" stroke="#4e4130" stroke-width="6" fill="none"/>
    <path d="M 1130,540 l -10,-520 l 12,0 z" fill="#8a7452" opacity="0.75"/>
    <ellipse cx="1102" cy="544" rx="70" ry="16" fill="#4e4634" opacity="0.5"/>
  </g>
  <g>
    <polygon points="1250,600 1240,0 1320,0 1312,600" fill="#57493a"/>
    <path d="M 1246,460 q 24,-12 62,-8 M 1242,330 q 26,-14 70,-8" stroke="#463a2e" stroke-width="7" fill="none"/>
    <path d="M 1312,600 l -12,-600 l 14,0 z" fill="#7c684a" opacity="0.7"/>
    <ellipse cx="1278" cy="606" rx="80" ry="18" fill="#4e4634" opacity="0.5"/>
  </g>

  <!-- ======== SOTOBOSQUE (manto de hojarasca) ======== -->
  <path d="M 0,1000 L 0,560 Q 260,520 452,486 Q 700,452 900,462 Q 1200,478 1400,540 L 1600,600 L 1600,1000 Z" fill="#7c7048"/>
  <path d="M 0,640 Q 300,590 560,560 Q 480,590 300,640 Q 140,680 0,720 Z" fill="#8a7c52" opacity="0.7"/>

  <!-- ======== ARROYO (cruza de izquierda a derecha por delante del claro) ======== -->
  <g>
    <path d="M 0,586
             C 280,560 540,550 760,558
             C 990,568 1180,660 1330,795
             C 1420,878 1500,950 1560,1000
             L 1360,1000
             C 1320,940 1240,860 1150,780
             C 1020,668 880,626 720,620
             C 500,614 240,624 0,644 Z" fill="url(#agua)"/>
    <!-- glints cortos del cielo -->
    <g stroke="#d8e2dc" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M 180,606 q 60,-8 120,-6"/>
      <path d="M 460,584 q 60,-6 120,-2"/>
      <path d="M 950,600 q 56,16 100,44"/>
      <path d="M 1210,760 q 46,40 84,86"/>
    </g>
    <g stroke="#54686c" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M 320,616 q 50,-6 100,-4"/>
      <path d="M 1080,680 q 44,28 80,64"/>
    </g>
    <!-- piedras del cauce -->
    <g fill="#8a8a78">
      <ellipse cx="250" cy="622" rx="26" ry="9"/>
      <ellipse cx="560" cy="596" rx="24" ry="8"/>
      <ellipse cx="1060" cy="672" rx="30" ry="12"/>
      <ellipse cx="1300" cy="850" rx="44" ry="17"/>
    </g>
    <g fill="#a8a894">
      <ellipse cx="246" cy="618" rx="26" ry="8"/>
      <ellipse cx="556" cy="592" rx="24" ry="7"/>
      <ellipse cx="1056" cy="667" rx="30" ry="11"/>
      <ellipse cx="1296" cy="844" rx="44" ry="16"/>
    </g>
    <!-- hierbas de orilla -->
    <g stroke="#77884c" stroke-width="3" fill="none">
      <path d="M 340,648 q 4,-24 18,-36 M 352,652 q 8,-20 24,-28"/>
      <path d="M 1150,790 q 4,-28 20,-42 M 1164,798 q 10,-24 28,-34"/>
    </g>
  </g>

  <!-- ======== SENDA (cruza el arroyo POR el puente) ======== -->
  <!-- tramo cercano: de abajo a la cabecera sur -->
