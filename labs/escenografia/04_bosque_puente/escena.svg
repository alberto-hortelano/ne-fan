  <g>
    <path d="M 0,1000 L 0,0 L 200,0 L 192,660 Q 210,780 260,880 L 288,1000 Z" fill="#33291e"/>
    <path d="M 192,660 Q 210,780 260,880 L 288,1000 L 210,1000 Q 176,880 170,760 Z" fill="#3f342a"/>
    <path d="M 288,1000 Q 300,940 350,920 L 380,1000 Z" fill="#33291e"/>
    <path d="M 210,1000 Q 190,950 140,940 L 120,1000 Z" fill="#2c231a"/>
    <g stroke="#241c14" stroke-width="7" fill="none" opacity="0.8">
      <path d="M 60,0 Q 70,300 66,640 Q 66,800 96,980"/>
      <path d="M 130,0 Q 138,320 134,660 Q 138,820 176,990"/>
    </g>
    <g stroke="#4a3f30" stroke-width="4" fill="none" opacity="0.7">
      <path d="M 96,0 Q 104,300 100,620"/>
      <path d="M 168,0 Q 174,280 170,600"/>
    </g>
    <g fill="#4a6338">
      <ellipse cx="52" cy="220" rx="34" ry="22"/>
      <ellipse cx="90" cy="300" rx="40" ry="26"/>
      <ellipse cx="58" cy="390" rx="30" ry="20"/>
      <ellipse cx="110" cy="470" rx="34" ry="22"/>
      <ellipse cx="76" cy="560" rx="26" ry="18"/>
    </g>
    <g fill="#5f7a44">
      <ellipse cx="66" cy="250" rx="20" ry="13"/>
      <ellipse cx="100" cy="330" rx="22" ry="14"/>
      <ellipse cx="90" cy="500" rx="18" ry="12"/>
    </g>
  </g>
  <g>
    <path d="M 1600,1000 L 1600,0 L 1400,0 L 1412,540 Q 1400,760 1360,900 L 1340,1000 Z" fill="#2c231a"/>
    <path d="M 1412,540 Q 1400,760 1360,900 L 1340,1000 L 1420,1000 Q 1450,860 1456,700 Z" fill="#3a2f24"/>
    <g stroke="#201914" stroke-width="8" fill="none" opacity="0.8">
