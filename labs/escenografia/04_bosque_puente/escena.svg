           C 430,850 550,740 692,648
           L 850,656
           C 800,740 660,880 590,1000 Z" fill="url(#senda)"/>
  <!-- tramo lejano: de la cabecera norte al claro -->
  <path d="M 758,566 L 854,572
           C 838,528 812,492 782,462
           L 738,452
           C 740,492 746,532 758,566 Z" fill="url(#senda)"/>
  <!-- roderas del tramo cercano -->
  <g stroke="#8a7854" stroke-width="7" fill="none" opacity="0.6">
    <path d="M 400,1000 C 500,860 600,760 720,672"/>
    <path d="M 470,1000 C 570,880 660,790 790,678"/>
  </g>
  <!-- raíces cruzando la senda -->
  <g stroke="#6b5a40" fill="none" opacity="0.8">
    <path d="M 370,940 q 120,-24 240,-10" stroke-width="9"/>
    <path d="M 500,830 q 100,-20 200,-8" stroke-width="7"/>
    <path d="M 620,740 q 80,-16 160,-10" stroke-width="6"/>
  </g>

  <!-- ======== PUENTE DE TABLONES (perpendicular al arroyo) ======== -->
  <g>
    <!-- sombra en el agua bajo el vano -->
    <ellipse cx="786" cy="614" rx="88" ry="14" fill="#3a4436" opacity="0.35"/>
    <!-- estribos en las dos orillas -->
    <polygon points="684,644 864,652 864,672 684,664" fill="#4e4130"/>
    <polygon points="742,564 868,570 868,584 742,578" fill="#4e4130"/>
    <!-- grosor del tablero (visto por debajo del canto sur) -->
    <path d="M 692,650 L 858,656 L 858,674 L 692,668 Z" fill="#57503f"/>
    <!-- tablero combado (canto izquierdo y derecho abombados) -->
    <path d="M 692,650 Q 706,604 760,568 L 856,574 Q 866,612 858,656 Z" fill="#8a8274"/>
    <!-- canto cercano iluminado -->
    <path d="M 692,650 L 858,656" stroke="#b3ab98" stroke-width="5" fill="none"/>
    <!-- tablones perpendiculares al paso -->
    <g stroke="#6b6355" stroke-width="4" opacity="0.9">
      <line x1="700" y1="636" x2="856" y2="642"/>
      <line x1="710" y1="620" x2="858" y2="626"/>
      <line x1="722" y1="604" x2="860" y2="610"/>
      <line x1="734" y1="590" x2="861" y2="595"/>
      <line x1="748" y1="578" x2="862" y2="582"/>
    </g>
    <!-- baranda única, aguas arriba (izquierda) -->
    <g stroke="#6e6759" stroke-width="10">
      <line x1="700" y1="650" x2="700" y2="590"/>
      <line x1="724" y1="606" x2="724" y2="550"/>
      <line x1="752" y1="572" x2="752" y2="522"/>
    </g>
    <path d="M 694,594 Q 720,550 756,526 L 762,530" stroke="#8a8274" stroke-width="9" fill="none"/>
    <circle cx="700" cy="588" r="6" fill="#8a8274"/>
    <circle cx="752" cy="521" r="5" fill="#8a8274"/>
  </g>

