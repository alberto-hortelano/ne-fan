    <path d="M 620,880 q 10,-70 60,-96 M 640,890 q 30,-60 88,-74 M 610,876 q -6,-60 24,-96"/>
    <path d="M 1180,820 q 12,-56 54,-78 M 1200,830 q 28,-48 76,-58"/>
  </g>
  <g stroke="#77884c" stroke-width="3" fill="none">
    <path d="M 630,872 q 8,-52 44,-72 M 1192,816 q 10,-44 42,-60"/>
  </g>
  <!-- corro de setas rojas al pie del haya grande -->
  <g transform="translate(210,-40)">
    <g fill="#b0402e">
      <path d="M 216,916 a 28,17 0 0 1 56,0 z"/>
      <path d="M 280,944 a 24,15 0 0 1 48,0 z"/>
      <path d="M 178,954 a 21,14 0 0 1 42,0 z"/>
    </g>
    <g fill="#e8dcc8">
      <rect x="236" y="916" width="15" height="24" rx="6"/>
      <rect x="297" y="944" width="13" height="20" rx="5"/>
      <rect x="193" y="954" width="12" height="18" rx="5"/>
      <circle cx="232" cy="907" r="3.2"/><circle cx="252" cy="903" r="3.2"/>
      <circle cx="292" cy="935" r="2.8"/><circle cx="196" cy="946" r="2.8"/>
    </g>
  </g>

