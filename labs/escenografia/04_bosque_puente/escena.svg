    <path d="M 120,760 Q 360,700 560,706 L 560,748 Q 360,742 130,806 Z" fill="#5c5240"/>
    <!-- parches de musgo sobre el lomo -->
    <g fill="#6e7a4c">
      <ellipse cx="200" cy="756" rx="52" ry="12" transform="rotate(-8 200 756)"/>
      <ellipse cx="330" cy="722" rx="60" ry="12" transform="rotate(-6 330 722)"/>
      <ellipse cx="470" cy="710" rx="44" ry="10" transform="rotate(-2 470 710)"/>
    </g>
    <!-- testa con anillos -->
    <ellipse cx="562" cy="727" rx="14" ry="21" fill="#8a7452"/>
    <ellipse cx="562" cy="727" rx="9" ry="14" fill="none" stroke="#57493a" stroke-width="2.5"/>
    <ellipse cx="562" cy="727" rx="4" ry="7" fill="none" stroke="#57493a" stroke-width="2"/>
    <path d="M 180,752 q 30,-8 60,-8 M 300,730 q 40,-8 80,-6" stroke="#4a4234" stroke-width="4" fill="none"/>
    <ellipse cx="340" cy="800" rx="210" ry="18" fill="#5c5438" opacity="0.4"/>
  </g>

