<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Plaza del mercado, media mañana. Horizonte y=380, fuga en el tercio izquierdo (~560,380). Sol del ESTE (derecha). -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9cc8"/>
      <stop offset="0.6" stop-color="#a8c2ce"/>
      <stop offset="1" stop-color="#e9e4cf"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3cc" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff3cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plaza" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a89882"/>
      <stop offset="0.6" stop-color="#bcaa8e"/>
      <stop offset="1" stop-color="#d2bfa0"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8cc"/>
      <stop offset="1" stop-color="#dcCBa4"/>
    </linearGradient>
    <clipPath id="plazaclip">
      <polygon points="0,1000 0,700 210,600 380,500 520,430 560,436 890,455 1450,1000"/>
    </clipPath>
  </defs>

  <!-- ======== CIELO ======== -->
  <rect x="0" y="0" width="1600" height="470" fill="url(#sky2)"/>
  <ellipse cx="1430" cy="240" rx="460" ry="300" fill="url(#glow2)"/>
  <path d="M 160,130 q 180,-20 380,-8 q 220,12 400,-4 l 3,10 q -200,16 -420,10 q -200,-6 -360,4 z" fill="#e6ebee" opacity="0.5"/>
  <path d="M 900,200 q 160,-12 330,-2 l 2,9 q -150,10 -330,4 z" fill="#eae7da" opacity="0.45"/>

  <!-- ======== FONDO: vega pálida entre tejados ======== -->
  <!-- valle con chopos y camino, visto por el hueco del caserío -->
  <g>
    <path d="M 540,455 l 0,-60 q 180,-24 360,-8 l 0,68 z" fill="#c3cfd2" opacity="0.9"/>
    <path d="M 560,452 q 90,-16 180,-10 q -30,26 -60,20 q -70,10 -120,-10 z" fill="#d8d3bc" opacity="0.9"/>
    <!-- camino que baja a la vega -->
    <path d="M 700,456 q 10,-30 26,-48 q 14,-16 6,-2 q -12,24 -14,50 z" fill="#e2d8b8"/>
    <path d="M 716,404 q 20,-14 44,-12 q -18,10 -38,16 z" fill="#e2d8b8" opacity="0.8"/>
    <!-- chopos -->
    <g fill="#9aae96">
      <ellipse cx="620" cy="416" rx="9" ry="30"/>
      <ellipse cx="648" cy="410" rx="8" ry="34"/>
      <ellipse cx="780" cy="414" rx="9" ry="32"/>
      <ellipse cx="806" cy="420" rx="7" ry="26"/>
      <ellipse cx="836" cy="416" rx="8" ry="30"/>
    </g>
    <g stroke="#6f8270" stroke-width="2">
      <line x1="620" y1="446" x2="620" y2="404"/>
      <line x1="648" y1="444" x2="648" y2="396"/>
      <line x1="780" y1="446" x2="780" y2="400"/>
      <line x1="836" y1="446" x2="836" y2="402"/>
    </g>
  </g>
  <!-- caserío del fondo cerrando la plaza (con el hueco de la vega) -->
  <g>
    <polygon points="520,436 520,330 570,300 620,330 620,438" fill="#d8c6a4"/>
    <polygon points="520,330 570,300 620,330" fill="#b06a4c"/>
    <rect x="548" y="360" width="20" height="28" fill="#4a3c2e"/>
    <polygon points="620,438 620,346 700,340 700,442" fill="#cdbb98"/>
    <polygon points="612,348 660,318 706,342 700,340 620,346" fill="#a86048"/>
    <rect x="640" y="372" width="18" height="26" fill="#42362b"/>
    <!-- hueco de la vega entre 700 y 760 -->
    <polygon points="760,444 760,352 856,346 856,450" fill="#d3bf9c"/>
    <polygon points="752,354 806,322 862,348 856,346 760,352" fill="#b06a4c"/>
    <rect x="788" y="378" width="20" height="28" fill="#4a3c2e"/>
    <rect x="820" y="378" width="18" height="28" fill="#42362b"/>
  </g>

  <!-- ======== FILA IZQUIERDA (fachadas al sol, en fuga) ======== -->
  <!-- H3: casa encalada con hastial -->
  <g>
    <polygon points="380,500 380,262 450,216 520,258 520,430" fill="#eee2c4"/>
    <polygon points="368,266 450,212 532,262 520,258 380,262" fill="#b06a4c"/>
    <polygon points="368,266 450,212 450,262" fill="#c8815c"/>
    <rect x="404" y="300" width="26" height="40" fill="#42362b" stroke="#8a6a4a" stroke-width="2.5"/>
    <rect x="462" y="296" width="26" height="40" fill="#3c3128" stroke="#8a6a4a" stroke-width="2.5"/>
    <path d="M 430,430 l 0,-52 a 21,21 0 0 1 42,0 l 0,50 z" fill="#33281e"/>
    <polygon points="486,246 486,206 506,206 506,258" fill="#8d7a64"/>
  </g>
  <!-- H2: casa de mercader con balcón y pendón del gremio -->
  <g>
    <polygon points="210,600 210,10 380,-20 380,500" fill="#e5cfa4"/>
    <polygon points="210,10 380,-20 380,30 210,58" fill="#a86048"/>
    <g stroke="#7a5a3c" stroke-width="4" opacity="0.85">
      <line x1="212" y1="300" x2="380" y2="262"/>
      <line x1="298" y1="16" x2="298" y2="560"/>
    </g>
    <rect x="234" y="330" width="36" height="56" fill="#42362b" stroke="#8a6a4a" stroke-width="3"/>
    <rect x="316" y="316" width="36" height="56" fill="#3c3128" stroke="#8a6a4a" stroke-width="3"/>
    <rect x="234" y="120" width="36" height="60" fill="#4a3c2e" stroke="#8a6a4a" stroke-width="3"/>
    <rect x="316" y="106" width="36" height="60" fill="#42362b" stroke="#8a6a4a" stroke-width="3"/>
    <!-- balcón -->
    <rect x="226" y="386" width="132" height="9" fill="#6b4f36"/>
    <g stroke="#6b4f36" stroke-width="3">
      <line x1="232" y1="386" x2="232" y2="356"/><line x1="258" y1="386" x2="258" y2="356"/>
      <line x1="284" y1="386" x2="284" y2="356"/><line x1="310" y1="386" x2="310" y2="356"/>
      <line x1="336" y1="386" x2="336" y2="356"/><line x1="352" y1="384" x2="352" y2="356"/>
      <line x1="228" y1="356" x2="356" y2="356"/>
    </g>
    <!-- pendón vertical del gremio -->
    <rect x="270" y="430" width="44" height="120" fill="#7a3b30"/>
    <polygon points="270,550 292,578 314,550" fill="#7a3b30"/>
    <circle cx="292" cy="470" r="14" fill="#d9a24e"/>
    <path d="M 284,496 l 16,0 l -8,14 z" fill="#d9a24e"/>
  </g>
  <!-- H1: casa cercana con pórtico, muy recortada -->
  <g>
    <polygon points="0,700 0,0 210,0 210,600" fill="#dec394"/>
    <!-- pórtico adosado: dos columnas y viga -->
    <polygon points="0,760 0,560 226,470 226,640" fill="#8d7455" opacity="0.4"/>
    <rect x="30" y="330" width="200" height="26" fill="#6b4f36" transform="rotate(-10 130 343)"/>
    <g fill="#c9b493">
      <polygon points="52,880 52,392 84,386 88,880"/>
      <polygon points="176,760 176,420 202,416 206,760"/>
    </g>
    <g fill="#a8916f">
      <polygon points="84,386 88,880 98,876 94,384"/>
      <polygon points="202,416 206,760 214,757 210,414"/>
    </g>
    <!-- romana colgada de la viga -->
    <g stroke="#3a2f24" stroke-width="4" fill="none">
      <line x1="140" y1="368" x2="140" y2="420"/>
      <line x1="96" y1="420" x2="196" y2="420"/>
      <line x1="110" y1="420" x2="110" y2="452"/>
      <line x1="176" y1="420" x2="176" y2="446"/>
    </g>
    <path d="M 92,452 a 18,10 0 0 0 36,0 z" fill="#5c4b38"/>
    <circle cx="176" cy="456" r="11" fill="#3a2f24"/>
    <!-- ventana alta -->
    <rect x="60" y="120" width="44" height="70" fill="#42362b" stroke="#8a6a4a" stroke-width="3"/>
    <rect x="140" y="110" width="44" height="70" fill="#3c3128" stroke="#8a6a4a" stroke-width="3"/>
  </g>

  <!-- ======== IGLESIA (flanco de sillería en sombra, derecha) ======== -->
  <g>
    <polygon points="890,455 890,0 1600,0 1600,1000 1450,1000" fill="#8d8272"/>
    <!-- tinte frío de la cara oeste en sombra -->
    <polygon points="890,455 890,0 1600,0 1600,1000 1450,1000" fill="#5c6478" opacity="0.22"/>
    <!-- cornisa en fuga -->
    <path d="M 890,96 L 1600,-60" stroke="#6e6455" stroke-width="10" fill="none"/>
    <!-- ventanales góticos altos -->
    <g fill="#3e3a34">
      <path d="M 960,300 l 0,-90 a 22,30 0 0 1 44,0 l 0,90 z"/>
      <path d="M 1090,282 l 0,-102 a 26,36 0 0 1 52,0 l 0,102 z"/>
      <path d="M 1250,258 l 0,-118 a 31,42 0 0 1 62,0 l 0,118 z"/>
      <path d="M 1450,226 l 0,-140 a 38,50 0 0 1 76,0 l 0,140 z"/>
    </g>
    <g fill="none" stroke="#565046" stroke-width="4">
      <path d="M 960,300 l 0,-90 a 22,30 0 0 1 44,0 l 0,90"/>
      <path d="M 1090,282 l 0,-102 a 26,36 0 0 1 52,0 l 0,102"/>
      <path d="M 1250,258 l 0,-118 a 31,42 0 0 1 62,0 l 0,118"/>
      <path d="M 1450,226 l 0,-140 a 38,50 0 0 1 76,0 l 0,140"/>
    </g>
    <!-- juntas de sillería en fuga -->
    <g stroke="#7c7263" stroke-width="2.5" opacity="0.6">
      <path d="M 890,360 L 1600,290"/>
      <path d="M 890,410 L 1600,420"/>
      <path d="M 890,430 L 1560,560"/>
    </g>
    <!-- contrafuertes: frente en sombra, canto este encendido -->
    <g>
      <polygon points="1010,480 1010,150 1054,150 1054,488" fill="#655c4e"/>
      <polygon points="1054,150 1054,488 1072,492 1072,154" fill="#a89878"/>
      <polygon points="994,484 1010,480 1010,320 994,322" fill="#4e4839" opacity="0.7"/>
      <polygon points="1200,560 1200,120 1256,120 1256,572" fill="#615949"/>
      <polygon points="1256,120 1256,572 1280,580 1280,126" fill="#b0a07c"/>
      <polygon points="1178,566 1200,560 1200,340 1178,344" opacity="0.7" fill="#4e4839"/>
      <polygon points="1430,690 1430,80 1500,80 1500,706" fill="#5c5445"/>
      <polygon points="1500,80 1500,706 1532,718 1532,88" fill="#b8a880"/>
      <polygon points="1400,698 1430,690 1430,380 1400,386" opacity="0.7" fill="#4e4839"/>
    </g>
    <!-- puerta lateral con arquivoltas -->
    <path d="M 1330,640 l 0,-120 a 52,58 0 0 1 104,0 l 0,128 z" fill="#4e463c"/>
    <path d="M 1342,640 l 0,-112 a 42,48 0 0 1 84,0 l 0,118 z" fill="#2e2823"/>
  </g>

  <!-- ======== SUELO DE LA PLAZA ======== -->
  <polygon points="0,1000 0,700 210,600 380,500 520,430 560,436 890,455 1450,1000" fill="url(#plaza)"/>
  <g clip-path="url(#plazaclip)">
    <!-- gran sombra diagonal de la iglesia partiendo la plaza,
         con dientes de contrafuertes en el borde oeste -->
    <polygon points="890,455 1450,1000 1120,1000 990,840 1030,815 880,680 918,655 795,555 830,532 745,478"
             fill="#2e3450" opacity="0.32"/>
    <!-- hiladas de adoquín en abanico, comprimidas cuesta arriba -->
    <g stroke="#8a7a64" fill="none" opacity="0.4">
      <path d="M 60,940 q 640,-160 1360,60" stroke-width="5"/>
      <path d="M 130,860 q 600,-140 1230,50" stroke-width="4.5"/>
      <path d="M 200,790 q 560,-120 1110,44" stroke-width="4"/>
      <path d="M 270,724 q 500,-104 990,38" stroke-width="3.5"/>
      <path d="M 330,668 q 460,-88 880,32" stroke-width="3"/>
      <path d="M 390,618 q 400,-72 770,28" stroke-width="2.5"/>
      <path d="M 440,576 q 360,-60 680,22" stroke-width="2.2"/>
      <path d="M 480,540 q 320,-48 600,18" stroke-width="1.8"/>
      <path d="M 516,510 q 280,-38 530,14" stroke-width="1.5"/>
      <path d="M 548,486 q 240,-30 460,10" stroke-width="1.3"/>
      <path d="M 574,466 q 200,-22 396,8" stroke-width="1.1"/>
    </g>
    <g stroke="#8a7a64" fill="none" opacity="0.25">
      <path d="M 250,1000 C 420,760 520,580 570,450" stroke-width="4"/>
      <path d="M 700,1000 C 680,780 640,560 600,448" stroke-width="4"/>
      <path d="M 1130,1000 C 950,760 740,540 620,452" stroke-width="4"/>
    </g>
    <!-- encharcado alrededor de la fuente -->
    <ellipse cx="520" cy="632" rx="185" ry="40" fill="#b8c4c2" opacity="0.3"/>
    <ellipse cx="628" cy="664" rx="56" ry="12" fill="#c9d2cc" opacity="0.35"/>
    <!-- sombra del pilón hacia el oeste, pegada a la base -->
    <polygon points="380,600 452,646 380,660 300,636 302,614" fill="#2e3450" opacity="0.22"/>
  </g>

  <!-- ======== FUENTE (foco, al sol) ======== -->
  <g>
    <!-- pilón octogonal -->
    <polygon points="380,590 452,566 588,566 660,590 660,618 588,646 452,646 380,618" fill="#cabb9e"/>
    <polygon points="380,618 452,646 588,646 660,618 660,634 588,664 452,664 380,634" fill="#a2937a"/>
    <!-- agua del pilón -->
    <polygon points="404,592 462,574 578,574 636,592 636,610 578,628 462,628 404,610" fill="#9fb8c2"/>
    <!-- columna central con tres caños -->
    <rect x="504" y="410" width="32" height="170" fill="#c2b294"/>
    <rect x="504" y="410" width="14" height="170" fill="#8f8168"/>
    <path d="M 500,410 l 40,0 l -6,-18 l -28,0 z" fill="#a89878"/>
    <circle cx="520" cy="376" r="17" fill="#b5a586"/>
    <!-- caños y chorros (el único blanco puro) -->
    <g stroke="#f6fbfc" stroke-width="5" fill="none" opacity="0.95">
      <path d="M 500,470 q -26,10 -34,104"/>
      <path d="M 540,470 q 26,10 34,104"/>
      <path d="M 520,462 q 2,20 0,116"/>
    </g>
    <g fill="#f6fbfc" opacity="0.8">
      <ellipse cx="466" cy="588" rx="14" ry="5"/>
      <ellipse cx="574" cy="588" rx="14" ry="5"/>
      <ellipse cx="520" cy="592" rx="12" ry="4"/>
    </g>
  </g>

  <!-- ======== PUESTOS DEL MERCADO ======== -->
  <!-- S2: puesto pequeño de lona cruda -->
  <g>
    <polygon points="742,556 866,548 886,588 756,598" fill="url(#canvas)"/>
    <polygon points="742,556 756,598 750,600 737,559" fill="#b8a67e"/>
    <g stroke="#6b5138" stroke-width="4">
      <line x1="748" y1="560" x2="748" y2="650"/>
      <line x1="862" y1="552" x2="862" y2="640"/>
      <line x1="884" y1="588" x2="884" y2="656"/>
    </g>
    <polygon points="748,616 884,606 884,656 748,668" fill="#7c5f42"/>
    <!-- cestos con fruta -->
    <path d="M 766,616 a 20,12 0 0 0 40,0 z" fill="#a8814e"/>
    <g fill="#d98f3c"><circle cx="776" cy="612" r="6"/><circle cx="788" cy="609" r="6"/><circle cx="798" cy="613" r="5"/></g>
    <path d="M 822,612 a 22,13 0 0 0 44,0 z" fill="#a8814e"/>
    <g fill="#8fa04c"><circle cx="834" cy="608" r="6"/><circle cx="846" cy="605" r="7"/><circle cx="858" cy="609" r="5"/></g>
    <!-- gallinero de mimbre -->
    <path d="M 900,652 a 26,20 0 0 1 52,0 z" fill="#b3915e"/>
    <g stroke="#7c5f38" stroke-width="2" fill="none">
      <path d="M 900,652 a 26,20 0 0 1 52,0"/>
      <path d="M 906,640 a 20,12 0 0 1 40,0"/>
      <line x1="926" y1="632" x2="926" y2="652"/>
    </g>
  </g>
  <!-- S1: puesto grande con toldo rayado, medio en la sombra de la iglesia -->
  <g>
    <polygon points="928,590 1148,574 1204,668 964,690" fill="url(#canvas)"/>
    <g fill="#b0563e" opacity="0.85">
      <polygon points="962,588 996,585 1022,682 986,686"/>
      <polygon points="1062,580 1096,578 1130,674 1094,678"/>
    </g>
    <polygon points="928,590 964,690 956,692 921,593" fill="#b8a67e"/>
    <g stroke="#6b5138" stroke-width="5">
      <line x1="936" y1="596" x2="936" y2="760"/>
      <line x1="1142" y1="580" x2="1142" y2="730"/>
      <line x1="1200" y1="668" x2="1200" y2="790"/>
      <line x1="968" y1="690" x2="968" y2="774"/>
    </g>
    <polygon points="944,712 1196,692 1198,770 946,794" fill="#77593c"/>
    <line x1="944" y1="736" x2="1197" y2="714" stroke="#5a4229" stroke-width="4"/>
    <!-- mercancía: sacos abiertos y cestas -->
    <path d="M 986,712 a 26,15 0 0 0 52,0 z" fill="#a8814e"/>
    <g fill="#c9a84c"><circle cx="1000" cy="707" r="7"/><circle cx="1014" cy="704" r="7"/><circle cx="1026" cy="708" r="6"/></g>
    <path d="M 1064,706 a 28,16 0 0 0 56,0 z" fill="#9c7846"/>
    <g fill="#b8503c"><circle cx="1080" cy="700" r="7"/><circle cx="1094" cy="697" r="8"/><circle cx="1108" cy="701" r="6"/></g>
    <ellipse cx="1160" cy="712" rx="26" ry="16" fill="#cbb794"/>
    <path d="M 1146,700 q 14,-10 28,0" stroke="#8a7452" stroke-width="3" fill="none"/>
  </g>
  <!-- sacos junto a la iglesia, en la sombra -->
  <g>
    <ellipse cx="1272" cy="852" rx="52" ry="40" fill="#8f7c5c"/>
    <ellipse cx="1352" cy="876" rx="56" ry="44" fill="#9c8862"/>
    <path d="M 1250,822 q 22,-16 44,0" stroke="#6e5c40" stroke-width="4" fill="none"/>
    <path d="M 1330,844 q 22,-16 44,0" stroke="#6e5c40" stroke-width="4" fill="none"/>
    <ellipse cx="1310" cy="912" rx="110" ry="18" fill="#232a40" opacity="0.35"/>
  </g>

  <!-- ======== PRIMER TÉRMINO ======== -->
  <!-- toldo que invade la esquina superior izquierda -->
  <g>
    <path d="M 0,0 L 620,0 L 470,110
             q -24,26 -48,8 q -22,26 -46,9 q -23,26 -47,9 q -24,27 -48,10
             q -25,27 -50,10 q -26,28 -52,10 q -27,28 -54,11 q -28,29 -56,11
             q -30,30 -60,11 L 0,190 Z" fill="#e9dbb4"/>
    <polygon points="240,0 340,0 302,124 220,140" fill="#b0563e" opacity="0.8"/>
    <!-- vara del toldo -->
    <line x1="470" y1="110" x2="430" y2="1000" stroke="#4a3826" stroke-width="14"/>
    <line x1="470" y1="116" x2="620" y2="0" stroke="#4a3826" stroke-width="9"/>
  </g>
  <!-- mesa con calabazas, recortada por abajo -->
  <g>
    <polygon points="40,872 640,846 668,1000 0,1000" fill="#7c5f42"/>
    <path d="M 46,896 L 646,868" stroke="#5a4229" stroke-width="5"/>
    <path d="M 30,930 L 660,900" stroke="#5a4229" stroke-width="5"/>
    <!-- calabazas -->
    <g>
      <circle cx="170" cy="856" r="72" fill="#d08a3a"/>
      <path d="M 130,806 q 40,-24 80,0" stroke="#a86428" stroke-width="5" fill="none"/>
      <path d="M 170,784 q -4,-18 8,-26" stroke="#5f7040" stroke-width="8" fill="none"/>
      <ellipse cx="146" cy="856" rx="20" ry="60" fill="none" stroke="#b0702e" stroke-width="5"/>
      <ellipse cx="196" cy="856" rx="20" ry="60" fill="none" stroke="#b0702e" stroke-width="5"/>
      <circle cx="320" cy="850" r="58" fill="#c9973c"/>
      <ellipse cx="300" cy="850" rx="16" ry="48" fill="none" stroke="#a87a2c" stroke-width="4"/>
      <ellipse cx="340" cy="850" rx="16" ry="48" fill="none" stroke="#a87a2c" stroke-width="4"/>
      <path d="M 320,790 q -2,-14 8,-20" stroke="#5f7040" stroke-width="7" fill="none"/>
      <!-- calabacín alargado -->
      <ellipse cx="480" cy="862" rx="86" ry="30" fill="#7f9048" transform="rotate(-7 480 862)"/>
      <path d="M 402,876 q -16,-2 -22,-12" stroke="#55663a" stroke-width="7" fill="none"/>
      <ellipse cx="560" cy="836" rx="40" ry="26" fill="#c9a84c"/>
    </g>
  </g>

  <!-- vencejos -->
  <g stroke="#3f4650" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 700,150 q 10,-10 20,0 q 10,-10 20,0"/>
    <path d="M 780,190 q 8,-8 16,0 q 8,-8 16,0"/>
    <path d="M 660,240 q 7,-7 14,0 q 7,-7 14,0"/>
  </g>
</svg>
