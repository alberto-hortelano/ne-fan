<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Puerta de muralla al atardecer, contraluz. Horizonte y=430; el arco (920-1060) enmarca el sol. Cuesta arriba. -->
  <defs>
    <linearGradient id="cielo6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a4a"/>
      <stop offset="0.35" stop-color="#6e4258"/>
      <stop offset="0.7" stop-color="#c96a44"/>
      <stop offset="1" stop-color="#f2b45c"/>
    </linearGradient>
    <radialGradient id="sol6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.4" stop-color="#ffd98e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="calzada6" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a2b34"/>
      <stop offset="0.7" stop-color="#57404a"/>
      <stop offset="1" stop-color="#7c5a54"/>
    </linearGradient>
    <linearGradient id="chorro6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f2a04c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- ======== CIELO ======== -->
  <rect x="0" y="0" width="1600" height="620" fill="url(#cielo6)"/>
  <ellipse cx="990" cy="470" rx="520" ry="380" fill="url(#sol6)" opacity="0.55"/>
  <!-- nubes finas encendidas -->
  <path d="M 200,200 q 200,-20 420,-8 q 180,10 320,-4 l 4,12 q -200,16 -420,10 q -180,-6 -320,2 z" fill="#c97a5c" opacity="0.5"/>
  <path d="M 700,120 q 180,-14 380,-4 l 3,10 q -170,12 -380,6 z" fill="#8a5464" opacity="0.55"/>
  <path d="M 1100,280 q 160,-12 330,-2 l 2,10 q -150,10 -330,4 z" fill="#e89a5c" opacity="0.5"/>

  <!-- ======== MURALLA EN SILUETA ======== -->
  <!-- lienzo izquierdo, cercano y recortado, con almenas -->
  <g>
    <polygon points="0,900 0,60 60,60 60,100 130,100 130,60 200,60 200,100 270,100 270,64 340,64 340,104 410,104 410,150 520,170 520,208 590,208 590,246 660,246 660,284 730,284 730,320 830,336 830,560 410,700 0,900" fill="#38273a"/>
    <!-- filo naranja del adarve -->
    <path d="M 410,150 L 520,170 L 520,208 L 590,208 L 590,246 L 660,246 L 660,284 L 730,284 L 730,320 L 830,336" stroke="#f0a860" stroke-width="5" fill="none" opacity="0.95"/>
    <path d="M 0,60 L 60,60 L 60,100 L 130,100 L 130,60 L 200,60 L 200,100 L 270,100 L 270,64 L 340,64 L 340,104 L 410,104 L 410,150" stroke="#e89050" stroke-width="5" fill="none" opacity="0.9"/>
    <!-- saeteras -->
    <g fill="#241826">
      <rect x="150" y="300" width="16" height="70" rx="8"/>
      <rect x="330" y="330" width="14" height="62" rx="7"/>
      <rect x="560" y="360" width="12" height="54" rx="6"/>
    </g>
  </g>
  <!-- cubo izquierdo de la puerta -->
  <g>
    <polygon points="820,560 820,250 848,250 848,214 884,214 884,250 912,250 912,214 948,214 948,556" fill="#2c1e2e"/>
    <path d="M 820,250 L 848,250 L 848,214 L 884,214 L 884,250 L 912,250 L 912,214 L 948,214" stroke="#f0a860" stroke-width="5" fill="none"/>
    <line x1="820" y1="256" x2="820" y2="556" stroke="#e89050" stroke-width="3" opacity="0.7"/>
    <rect x="866" y="330" width="16" height="66" rx="8" fill="#1c1220"/>
  </g>
  <!-- cubo derecho con pendón lacio -->
  <g>
    <polygon points="1046,556 1046,214 1074,214 1074,178 1110,178 1110,214 1138,214 1138,178 1174,178 1174,560" fill="#2c1e2e"/>
    <path d="M 1046,214 L 1074,214 L 1074,178 L 1110,178 L 1110,214 L 1138,214 L 1138,178 L 1174,178" stroke="#f0a860" stroke-width="5" fill="none"/>
    <line x1="1174" y1="184" x2="1174" y2="560" stroke="#e89050" stroke-width="3" opacity="0.7"/>
    <rect x="1100" y="300" width="16" height="66" rx="8" fill="#1c1220"/>
    <!-- pendón sin viento -->
    <line x1="1108" y1="176" x2="1108" y2="96" stroke="#241826" stroke-width="6"/>
    <path d="M 1108,100 l 54,10 l -6,20 l 8,18 l -56,-8 z" fill="#6e2e34"/>
    <path d="M 1108,100 l 54,10" stroke="#e89050" stroke-width="3"/>
  </g>
  <!-- cuerpo sobre el arco (matacanes) -->
  <g>
    <polygon points="948,430 948,300 972,300 972,266 1000,266 1000,300 1024,300 1024,266 1046,266 1046,430 1024,430 1024,398 1000,398 1000,430 972,430 972,398 948,398" fill="#2c1e2e"/>
    <path d="M 948,300 L 972,300 L 972,266 L 1000,266 L 1000,300 L 1024,300 L 1024,266 L 1046,266" stroke="#f0a860" stroke-width="4.5" fill="none"/>
  </g>
  <!-- lienzo derecho descendiendo la ladera -->
  <g>
    <polygon points="1174,560 1174,300 1240,306 1240,270 1300,276 1300,312 1360,318 1360,282 1420,288 1420,324 1480,330 1480,296 1540,302 1540,338 1600,344 1600,600 1380,620" fill="#38273a"/>
    <path d="M 1174,300 L 1240,306 L 1240,270 L 1300,276 L 1300,312 L 1360,318 L 1360,282 L 1420,288 L 1420,324 L 1480,330 L 1480,296 L 1540,302 L 1540,338 L 1600,344" stroke="#e89050" stroke-width="4.5" fill="none" opacity="0.9"/>
    <rect x="1310" y="400" width="14" height="58" rx="7" fill="#241826"/>
    <rect x="1470" y="420" width="13" height="54" rx="6" fill="#241826"/>
  </g>

  <!-- ======== EL VANO: sol, colinas y camino que sigue ======== -->
  <g>
    <!-- arco (se recorta contra el cielo ardiente) -->
    <path d="M 948,556 l 0,-140 a 49,52 0 0 1 98,0 l 0,140 z" fill="#f6c05c"/>
    <!-- sol asomando dentro del vano -->
    <circle cx="1006" cy="470" r="40" fill="#fff3c4"/>
    <circle cx="1006" cy="470" r="58" fill="url(#sol6)"/>
    <!-- colinas lejanas dentro del vano -->
    <path d="M 948,520 q 30,-14 60,-8 q 24,6 38,2 l 0,42 l -98,0 z" fill="#a86648" opacity="0.85"/>
    <!-- el camino continúa al otro lado -->
    <path d="M 986,556 q 6,-16 4,-30 q 10,16 18,30 z" fill="#f2dc9c" opacity="0.9"/>
    <!-- hoja del portón entreabierta -->
    <path d="M 948,556 l 0,-140 a 49,52 0 0 1 30,-46 l 14,10 l 0,176 z" fill="#241a26"/>
    <path d="M 978,370 l 14,10 l 0,176" stroke="#e89050" stroke-width="3.5" fill="none"/>
    <g stroke="#3a2a38" stroke-width="3">
      <line x1="958" y1="420" x2="990" y2="404"/>
      <line x1="958" y1="480" x2="991" y2="470"/>
      <line x1="958" y1="530" x2="991" y2="524"/>
    </g>
  </g>

  <!-- ======== CALZADA EN CUESTA ======== -->
  <polygon points="0,1000 0,900 410,700 830,560 948,556 1046,556 1174,560 1380,620 1600,600 1600,1000" fill="url(#calzada6)"/>
  <!-- chorro de luz derramándose por el arco cuesta abajo -->
  <polygon points="948,556 1046,556 1240,1000 620,1000" fill="url(#chorro6)"/>
  <!-- sombras de los cubos hacia cámara -->
  <polygon points="820,560 948,556 660,1000 140,1000" fill="#241a2c" opacity="0.7"/>
  <polygon points="1046,556 1174,562 1560,1000 1200,1000" fill="#241a2c" opacity="0.7"/>
  <!-- hiladas del empedrado comprimidas hacia el arco -->
  <g stroke="#2a1e2c" fill="none" opacity="0.6">
    <path d="M 120,940 q 700,-140 1420,-30" stroke-width="5"/>
    <path d="M 300,850 q 600,-110 1180,-30" stroke-width="4.5"/>
    <path d="M 450,780 q 520,-90 1000,-28" stroke-width="4"/>
    <path d="M 580,724 q 440,-72 850,-24" stroke-width="3.5"/>
    <path d="M 680,678 q 380,-58 730,-20" stroke-width="3"/>
    <path d="M 760,644 q 320,-46 620,-16" stroke-width="2.5"/>
    <path d="M 830,616 q 260,-36 510,-13" stroke-width="2"/>
    <path d="M 884,594 q 210,-27 410,-10" stroke-width="1.7"/>
  </g>
  <!-- roderas encendidas por la rasante -->
  <g fill="none">
    <path d="M 700,1000 Q 820,760 948,570" stroke="#1c1424" stroke-width="16" opacity="0.8"/>
    <path d="M 1160,1000 Q 1090,760 1032,570" stroke="#1c1424" stroke-width="16" opacity="0.8"/>
    <path d="M 712,1000 Q 830,760 952,572" stroke="#ffcf7c" stroke-width="5" opacity="0.9"/>
    <path d="M 1148,1000 Q 1082,760 1028,572" stroke="#ffcf7c" stroke-width="5" opacity="0.9"/>
  </g>
  <!-- cantos de piedra encendidos en el pasillo de luz -->
  <g stroke="#f0b468" stroke-width="3" opacity="0.8" fill="none">
    <path d="M 800,820 q 40,-8 80,-6"/>
    <path d="M 900,720 q 34,-7 68,-5"/>
    <path d="M 960,650 q 28,-5 56,-4"/>
    <path d="M 870,900 q 46,-9 92,-7"/>
    <path d="M 1010,760 q 30,-6 60,-4"/>
  </g>

  <!-- ======== PRIMER TÉRMINO EN SILUETA ======== -->
  <!-- crucero de piedra inclinado, abajo-derecha -->
  <g>
    <g transform="rotate(-7 1400 800)">
      <polygon points="1330,1000 1348,820 1372,760 1428,760 1452,820 1470,1000" fill="#241a26"/>
      <rect x="1382" y="560" width="36" height="210" fill="#241a26"/>
      <rect x="1330" y="620" width="140" height="34" rx="8" fill="#241a26"/>
      <rect x="1382" y="560" width="36" height="210" fill="none"/>
      <path d="M 1418,566 l 0,200 M 1470,632 l -52,0" stroke="#f0a860" stroke-width="4" opacity="0.9" fill="none"/>
    </g>
    <!-- cardos entre las grietas -->
    <g stroke="#1c1420" stroke-width="5" fill="none">
      <path d="M 1310,1000 q -6,-60 18,-96 M 1310,1000 q -30,-40 -26,-90 M 1316,1000 q 16,-44 46,-60"/>
    </g>
    <g fill="#4a2e44">
      <circle cx="1330" cy="898" r="11"/>
      <circle cx="1282" cy="906" r="10"/>
      <circle cx="1364" cy="936" r="9"/>
    </g>
    <g stroke="#e89050" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M 1322,890 q 8,-6 16,-2"/>
      <path d="M 1274,898 q 8,-6 15,-2"/>
    </g>
  </g>
  <!-- rocas y cardos abajo-izquierda -->
  <g>
    <path d="M 0,1000 l 0,-120 q 60,-24 130,4 q 70,26 96,60 l 10,56 z" fill="#1c1420"/>
    <path d="M 4,884 q 56,-22 124,4" stroke="#c97a4c" stroke-width="4" fill="none" opacity="0.8"/>
    <g stroke="#1c1420" stroke-width="5" fill="none">
      <path d="M 250,1000 q -4,-56 20,-88 M 250,1000 q -26,-36 -22,-80"/>
    </g>
    <circle cx="272" cy="906" r="10" fill="#4a2e44"/>
    <circle cx="228" cy="914" r="9" fill="#4a2e44"/>
  </g>

  <!-- grajos: tres en las almenas, uno en vuelo -->
  <g fill="#1c1420">
    <path d="M 596,236 q 10,-16 22,0 l -4,10 l -14,0 z"/>
    <path d="M 668,274 q 9,-14 20,0 l -4,9 l -12,0 z"/>
    <path d="M 1364,272 q 9,-14 20,0 l -4,9 l -12,0 z"/>
  </g>
  <path d="M 760,150 q 12,-14 24,0 q 12,-14 24,0" stroke="#1c1420" stroke-width="4" fill="none"/>
  <path d="M 1250,110 q 10,-12 20,0 q 10,-12 20,0" stroke="#241a26" stroke-width="3.5" fill="none"/>
</svg>
