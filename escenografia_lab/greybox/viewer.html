<!doctype html>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
  {"imports": {"three": "https://unpkg.com/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
  // viewer.html — render greybox a nivel de suelo de una escena three.js.
  //   ?scene=<módulo relativo> (export async build(THREE) → {group, camera,
  //     background?, fog?, depthMax?, manifest?})
  //   &pass=clay|depth|seg
  // clay: iluminado con sombras; depth: distancia lineal (blanco=cerca,
  // convención ControlNet); seg: color plano por userData.cat, sin AA.
  import * as THREE from "three";

  const params = new URLSearchParams(location.search);
  const PASS = params.get("pass") || "clay";
  const W = 1600, H = 1000;

  const SEG_COLORS = {
    building: 0xd04030,
    prop: 0xe0b040,
    terrain: 0x40a050,
    street: 0x90c060,
    water: 0x4060d0,
    tree: 0x208030,
    rock: 0x808080,
    decor: 0xb060c0,
  };

  const renderer = new THREE.WebGLRenderer({
    antialias: PASS !== "seg",
    preserveDrawingBuffer: true,
  });
  renderer.setSize(W, H);
  if (PASS === "clay") {
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  async function main() {
    const mod = await import(params.get("scene"));
    const built = await mod.build(THREE);
    scene.add(built.group);

    const spec = built.camera || { pos: [0, 1.6, 0], look: [0, 3, -40], fov: 32 };
    const cam = new THREE.PerspectiveCamera(spec.fov ?? 32, W / H, 0.3, 800);
    cam.position.set(...spec.pos);
    cam.lookAt(...spec.look);

    if (PASS === "clay") {
      if (built.background) scene.background = built.background;
      if (built.fog) scene.fog = built.fog;
      built.group.traverse((m) => {
        if (m.isMesh && !m.userData.sky) {
          m.castShadow = m.userData.noShadow ? false : true;
          m.receiveShadow = true;
        }
      });
    } else {
      scene.background = new THREE.Color(0x000000);
      built.group.traverse((m) => {
        if (m.userData.sky) m.visible = false;
        if (m.isLight) m.visible = false;
      });
    }

    if (PASS === "depth") {
      const maxDist = built.depthMax ?? 150;
      scene.overrideMaterial = new THREE.ShaderMaterial({
        uniforms: { maxDist: { value: maxDist } },
        vertexShader:
          "varying float vDist;\n" +
          "void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);" +
          " vDist = -mv.z; gl_Position = projectionMatrix * mv; }",
        fragmentShader:
          "varying float vDist; uniform float maxDist;\n" +
          "void main(){ float d = clamp(1.0 - vDist / maxDist, 0.0, 1.0);" +
          " gl_FragColor = vec4(vec3(d), 1.0); }",
      });
    }

    if (PASS === "seg") {
      built.group.traverse((m) => {
        if (m.isMesh && !m.userData.sky) {
          const cat = m.userData.cat || "prop";
          m.material = new THREE.MeshBasicMaterial({
            color: SEG_COLORS[cat] ?? 0xffffff,
          });
        }
      });
    }

    renderer.render(scene, cam);
    window.__manifest = JSON.stringify(built.manifest ?? null);
    const dump = document.createElement("pre");
    dump.id = "scene-dump";
    dump.style.display = "none";
    dump.textContent = window.__manifest;
    document.body.appendChild(dump);
    document.title = "ready";
  }

  main().catch((err) => {
    document.title = "error";
    const pre = document.createElement("pre");
    pre.id = "scene-error";
    pre.textContent = String((err && err.stack) || err);
    pre.style.color = "#f66";
    document.body.appendChild(pre);
  });
</script>
