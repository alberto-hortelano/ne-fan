<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Never Ending Fantasy — 2D</title>
  <script>
    // Bench (solo dev): `?raf=timer` sustituye requestAnimationFrame por un
    // pump ANTES de cargar la app, para que el game loop siga corriendo con
    // la pestaña en segundo plano (el navegador pausa el rAF de pestañas
    // ocultas y los drivers E2E de Chrome no pueden activar la pestaña). El
    // tick lo genera un Web Worker: los timers de la PÁGINA se throttlean a
    // ≥1 s con la pestaña oculta (con visibility "hidden" un setTimeout(33)
    // dispara ~1 vez/s y el loop parece muerto), los de un worker dedicado
    // no. Sin el flag no cambia nada.
    if (new URLSearchParams(location.search).get("raf") === "timer") {
      // Ping-pong, NO setInterval: el siguiente tick se pide DESPUÉS de
      // ejecutar el batch. Con setInterval, un frame que tarde >33 ms deja
      // mensajes acumulándose en la cola del main thread y la página queda
      // saturada para siempre (ni CDP puede entrar).
      const workerSrc = "onmessage = () => setTimeout(() => postMessage(0), 33);";
      const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
      let nextId = 1;
      let pending = new Map();
      let scheduled = false;
      worker.onmessage = () => {
        scheduled = false;
        const batch = pending;
        pending = new Map();
        const now = performance.now();
        for (const cb of batch.values()) cb(now);
        if (pending.size > 0 && !scheduled) {
          scheduled = true;
          worker.postMessage(0);
        }
      };
      window.requestAnimationFrame = (cb) => {
        const id = nextId++;
        pending.set(id, cb);
        if (!scheduled) {
          scheduled = true;
          worker.postMessage(0);
        }
        return id;
      };
      window.cancelAnimationFrame = (id) => { pending.delete(id); };
      console.warn("[bench] rAF sustituido por tick de Worker (33ms, ping-pong) — ?raf=timer");
    }
  </script>
  <link rel="stylesheet" href="/src/ui/base.css">
  <link rel="stylesheet" href="/src/ui/game-ui.css">
  <link rel="stylesheet" href="/src/ui/dev-ui.css">
</head>
<body>
  <!-- Panel de dev (dev-status-panel.ts): estado de generación de imágenes,
       caché, gasto estimado en € y config activa del ai_server. Vive FUERA de
       #game-ui: no se tematiza y manda sobre todos los overlays. -->
  <div id="dev-status">
    <select id="room-selector">
      <option value="">-- Room --</option>
    </select>
    <span id="connection-status" class="disconnected">Local</span>
    <span class="ds-gen" id="ds-gen"></span>
    <span class="ds-cache" id="ds-cache"></span>
    <label class="autoimg" title="Modo dev: las APIs de IA de pago (Meshy/fal) devuelven su última respuesta cacheada — 0 créditos por llamada">
      <input type="checkbox" id="devcache-toggle"><span>Dev-cache</span>
    </label>
    <span class="ds-spend" id="ds-spend"></span>
    <span class="ds-config" id="ds-config"></span>
    <span class="ds-session" id="ds-session"></span>
    <button id="ds-menu-btn" title="Lista de imágenes fake (clay / y_bot) con generación por item — los toggles globales viven en el chip de gráficos del HUD">Imágenes…</button>
  </div>
  <!-- Menú dev de imágenes (dev-menu.ts). -->
  <div id="dev-menu" hidden>
    <div class="dm-head">
      <span>Imágenes pendientes de generar</span>
      <button id="dm-close" title="Cerrar">×</button>
    </div>
    <div id="dev-menu-items"></div>
  </div>

  <!-- El lienzo y la UI de juego comparten caja: los paneles se posicionan
       contra el mundo visible, no contra el viewport. El lienzo del mundo
       (<canvas id="fps-canvas">) lo crea e inserta aquí FpsRenderer: es suyo,
       y desde que no hay más vistas, el único de la página. -->
  <div id="app-shell">
    <!-- UI DE JUEGO: única capa temable. data-locked lleva el estado del
         pointer lock; el CSS decide con él si los botones son clicables. -->
    <div id="game-ui" data-locked="false">
      <div class="ui-region" id="ui-top-left">
        <div id="player-status" class="nf-panel"></div>
        <div id="enemy-bars"></div>
      </div>
      <div class="ui-region" id="ui-top-right"></div>
      <div class="ui-region" id="ui-bottom-left">
        <div id="combat-log"></div>
        <div id="travel-panel" class="nf-panel" hidden></div>
      </div>
      <div class="ui-region" id="ui-bottom-center">
        <div id="tile-confirm-prompt" class="nf-panel" hidden>
          <span class="nf-question" id="tile-confirm-text"></span>
          <div id="tile-confirm-actions"></div>
        </div>
        <div id="interact-prompt" class="nf-panel"></div>
        <div id="dialogue-panel" class="nf-panel" hidden>
          <!-- Retrato del hablante: lo rellena PortraitView con una imagen
               (hero-shot ya pagado) o un lienzo animado (busto del idle). -->
          <div id="dialogue-portrait" aria-hidden="true"></div>
          <div id="dialogue-body">
            <div id="dialogue-speaker"></div>
            <div id="dialogue-text"></div>
            <div id="dialogue-choices" role="group"></div>
            <input id="dialogue-input" type="text" placeholder="Escribe tu respuesta y pulsa Enter…">
          </div>
        </div>
        <div id="action-bar"></div>
      </div>
      <div class="ui-region" id="ui-bottom-right">
        <!-- Chip de gráficos (graphics-mode.ts): modo de generación de
             imágenes IA de la partida; click abre el panel. -->
        <button id="gfx-chip" hidden></button>
        <div id="gfx-panel" class="nf-panel" role="dialog" aria-label="Generación de imágenes IA" hidden></div>
      </div>
      <!-- Etiquetas de nombre sobre el mundo (world-labels.ts): DOM para que
           hereden el tema del pack igual que el panel de diálogo. -->
      <div id="world-labels" aria-hidden="true"></div>
      <div id="reticle"></div>
      <div id="narrative-loader" role="status" aria-live="polite">
        <div class="spinner"></div>
        <div class="title" id="narrative-loader-title">Generando escena...</div>
        <div class="detail" id="narrative-loader-detail">El motor narrativo está construyendo el mundo. Puede tardar un momento.</div>
        <div class="elapsed" id="narrative-loader-elapsed"></div>
        <button class="dismiss nf-action" id="narrative-loader-dismiss" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="error-log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
