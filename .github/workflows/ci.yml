name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nefan-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Alineado con engines (>=24): node:sqlite del asset-store (F2).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nefan-core/package-lock.json
            narrative-mcp/package-lock.json
      - run: npm ci
      # contract-fixtures.test.ts carga narrative-mcp/validators.ts, que
      # importa @nefan/core (los parsers zod de producción): hace falta el
      # node_modules de narrative-mcp (symlink file:../nefan-core) y el dist
      # del core compilado.
      - run: npm ci
        working-directory: narrative-mcp
      - run: npx tsc --noEmit
      # `scripts/` no entra en el `include` del tsconfig de build (#231a): ese
      # lo consume `tsc -b` desde narrative-mcp por project reference y
      # ampliarlo emitiría `dist/scripts/*.js` + `.d.ts`. Sus tipos se
      # comprueban con un proyecto aparte en modo noEmit. Sin este paso, un
      # error de tipos en una rama no ejecutada de `scripts/` pasa
      # desapercibido — que es como se coló `r.rule.message` en #229.
      - run: npm run typecheck:scripts
      # `labs/` tampoco entraba en ningún proyecto TS (#309), y ahí vive el
      # motor falso con el que se verifica todo lo demás: sirvió durante seis
      # días un `scene_model` que el contrato había renombrado a
      # `surface_model` y nadie se enteró, porque `tsx` borra los tipos sin
      # mirarlos y el cliente lo pintaba como la palabra `undefined`. Este paso
      # ES el candado; la extensión del fichero no candaba nada.
      - run: npm run typecheck:labs
      - run: npm run lint
      - run: npm run build
      # `test/` tampoco entraba en ningún proyecto TS (#231b): 96 errores de
      # tipos el 2026-09-05 con las flags del build, y 15 de ellos eran tests
      # que MENTÍAN — escribían por una asa que la interfaz no tiene a propósito
      # (`sessionStorage.write`, #279), pasaban una rama retirada, forzaban un
      # `session_id = null` que el estado no puede tener. Sin este paso `tsx`
      # los ejecuta igual, borrando los tipos sin mirarlos. Va DETRÁS de
      # `build` porque `contract-fixtures.test.ts` importa
      # `narrative-mcp/validators.ts`, que resuelve `@nefan/core` por el
      # `dist/` del core: sin él, el proyecto de tests no tipa.
      - run: npm run typecheck:tests
      # UNA sola pasada de la suite. Había dos —`npm test` y luego `npm run
      # coverage`, el mismo glob `test/*.test.ts`— y la segunda es la primera
      # instrumentada: 1526 tests y ~50 s de CPU repetidos literalmente en cada
      # PR. Se va `npm test`, no `coverage`, porque `crap -- --check` necesita
      # el `coverage/lcov.info` que solo escribe el segundo; y el reporter
      # `spec` de `coverage` deja el mismo detalle por test en el log.
      #
      # En LOCAL la decisión es la contraria y a propósito (usuario,
      # 2026-08-27): `verify` sigue con `npm test` para que el bucle interno
      # dure ~8 s en vez de ~34 s, y `coverage` se corre cuando hace falta
      # saber de cobertura. El duplicado se corta una vez a cada lado.
      - run: npm run coverage
      - run: npm run crap -- --check

  narrative-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narrative-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            narrative-mcp/package-lock.json
            nefan-core/package-lock.json
      # La dependencia file:../nefan-core (F0) exige instalar las deps del
      # paquete enlazado; `npm run build` es `tsc -b`, que compila primero
      # nefan-core (project reference) y hace de typecheck (contract-check.ts
      # incluido) — sustituye al antiguo `npx tsc --noEmit`.
      - run: npm ci
        working-directory: nefan-core
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  nefan-html:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nefan-html/package-lock.json
      # nefan-html importa tipos de nefan-core por ruta relativa — hace falta
      # instalar también las deps del core para que tsc/vite resuelvan.
      - run: npm ci
      - run: npm ci --prefix ../nefan-core
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  ai-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pillow + httpx: deps ligeras de los tests de imagen y del adaptador de
      # sprite-forge. fastapi: lo usan test_spend_tracker y
      # test_sprite_forge_adapter (TestClient). numpy: lo importa
      # surface_atlas_generator.make_tileable, sujeto de test_surface_atlas.
      # El resto de la suite sigue siendo stdlib-only.
      #
      # uvicorn NO hace falta (#199): solo lo importan main.py y
      # remote_gen_main.py, que ningún test importa y que compileall compila
      # sin ejecutar. Ojo con quitar de más: estos tests NO son skipUnless
      # salvo los de sprite-forge, así que una dep ausente los volvería
      # verdes y VACÍOS en vez de rojos — comparar el conteo, no el color.
      #
      # La geometría del atlas de repintado ya NO se prueba aquí: se fue con el
      # módulo a sprite-forge, y allí corre en su propio CI.
      - run: pip install ruff pillow httpx fastapi numpy
      - run: ruff check ai_server
      # labs/ no tiene tests ni lint (benches), pero compileall lo mantiene
      # al menos sintácticamente válido — es código que se retoma cada pocos
      # meses cuando avanza la tecnología de IA.
      - run: python -m compileall -q ai_server labs
      # NEFAN_SPEND_DIR: el ledger de gasto (`cache/spend/events.jsonl`) es
      # dinero, y la suite le añadía 43 eventos de gasto INVENTADO por corrida
      # (#392). La variable lo desplaza a un temporal; olvidarla no es verde,
      # `SpendTracker` se niega a construirse sobre la ruta real bajo test.
      - run: NEFAN_SPEND_DIR=$(mktemp -d) python -m unittest discover -s ai_server/tests
