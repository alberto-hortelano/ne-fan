name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nefan-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Alineado con engines (>=24): node:sqlite del asset-store (F2).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nefan-core/package-lock.json
            narrative-mcp/package-lock.json
      - run: npm ci
      # contract-fixtures.test.ts carga narrative-mcp/validators.ts, que
      # importa @nefan/core (los parsers zod de producción): hace falta el
      # node_modules de narrative-mcp (symlink file:../nefan-core) y el dist
      # del core compilado.
      - run: npm ci
        working-directory: narrative-mcp
      - run: npx tsc --noEmit
      # `scripts/` no entra en el `include` del tsconfig de build (#231a): ese
      # lo consume `tsc -b` desde narrative-mcp por project reference y
      # ampliarlo emitiría `dist/scripts/*.js` + `.d.ts`. Sus tipos se
      # comprueban con un proyecto aparte en modo noEmit. Sin este paso, un
      # error de tipos en una rama no ejecutada de `scripts/` pasa
      # desapercibido — que es como se coló `r.rule.message` en #229.
      - run: npm run typecheck:scripts
      # `labs/` tampoco entraba en ningún proyecto TS (#309), y ahí vive el
      # motor falso con el que se verifica todo lo demás: sirvió durante seis
      # días un `scene_model` que el contrato había renombrado a
      # `surface_model` y nadie se enteró, porque `tsx` borra los tipos sin
      # mirarlos y el cliente lo pintaba como la palabra `undefined`. Este paso
      # ES el candado; la extensión del fichero no candaba nada.
      - run: npm run typecheck:labs
      - run: npm run lint
      - run: npm run build
      # `test/` tampoco entraba en ningún proyecto TS (#231b): 96 errores de
      # tipos el 2026-09-05 con las flags del build, y 15 de ellos eran tests
      # que MENTÍAN — escribían por una asa que la interfaz no tiene a propósito
      # (`sessionStorage.write`, #279), pasaban una rama retirada, forzaban un
      # `session_id = null` que el estado no puede tener. Sin este paso `tsx`
      # los ejecuta igual, borrando los tipos sin mirarlos. Va DETRÁS de
      # `build` porque `contract-fixtures.test.ts` importa
      # `narrative-mcp/validators.ts`, que resuelve `@nefan/core` por el
      # `dist/` del core: sin él, el proyecto de tests no tipa.
      - run: npm run typecheck:tests
      # UNA sola pasada de la suite. Había dos —`npm test` y luego `npm run
      # coverage`, el mismo glob `test/*.test.ts`— y la segunda es la primera
      # instrumentada: 1526 tests y ~50 s de CPU repetidos literalmente en cada
      # PR. Se va `npm test`, no `coverage`, porque `crap -- --check` necesita
      # el `coverage/lcov.info` que solo escribe el segundo; y el reporter
      # `spec` de `coverage` deja el mismo detalle por test en el log.
      #
      # En LOCAL la decisión es la contraria y a propósito (usuario,
      # 2026-08-27): `verify` sigue con `npm test` para que el bucle interno
      # dure ~8 s en vez de ~34 s, y `coverage` se corre cuando hace falta
      # saber de cobertura. El duplicado se corta una vez a cada lado.
      - run: npm run coverage
      - run: npm run crap -- --check
      # (~30 s) #598a: cada batería del plan de mutación EJERCE lo que su módulo
      # muta, medido corriendo las 61 baterías con `NODE_V8_COVERAGE` y contando
      # invocaciones. No entra en `npm test` a propósito: son 8,6 s de reloj con
      # ocho a la vez en una máquina de 16 núcleos (~60 s en serie) sobre una
      # suite que entera tarda 44, y el bucle interno de `verify` es lo que el
      # usuario decidió no encarecer el 2026-08-27 — el mismo trato que `crap`.
      #
      # Lo que caza y `npm test` no puede: `test/mutation-config.test.ts` exige
      # que la batería pueda CARGAR lo que muta, y cargar no es ejercer.
      # `src/world-map/place-target.ts` estaba en el módulo `world-map`, tres de
      # sus ocho tests lo IMPORTABAN y ninguno lo llamaba: 35 mutantes, 35
      # vivos, tres corridas commiteadas y nada en rojo.
      - run: npm run ejercicio

  narrative-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narrative-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            narrative-mcp/package-lock.json
            nefan-core/package-lock.json
      # La dependencia file:../nefan-core (F0) exige instalar las deps del
      # paquete enlazado; `npm run build` es `tsc -b`, que compila primero
      # nefan-core (project reference) y hace de typecheck (contract-check.ts
      # incluido) — sustituye al antiguo `npx tsc --noEmit`.
      - run: npm ci
        working-directory: nefan-core
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  nefan-html:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24 y no 22 desde el banco (#636): `npm test` ejecuta fuente de
          # `nefan-core` por el alias, y el core declara `engines: >=24`. Correr
          # el banco bajo otro mayor que el que usa todo el mundo en local es
          # exactamente la divergencia que este job existe para no tener.
          node-version: 24
          cache: npm
          cache-dependency-path: nefan-html/package-lock.json
      # nefan-html importa tipos de nefan-core por ruta relativa — hace falta
      # instalar también las deps del core para que tsc/vite resuelvan.
      - run: npm ci
      - run: npm ci --prefix ../nefan-core
      - run: npx tsc --noEmit
      - run: npm run lint
      # EL BANCO DEL CLIENTE (#636). Son DOS pasos y hacen falta los dos: el
      # `npx tsc --noEmit` de arriba comprueba `src/` SIN los tipos de Node
      # (`types: []`), que es la mitad de tipos del invariante «el cliente no
      # alcanza node»; éste comprueba `test/` CON ellos. El de abajo no
      # sustituye al de arriba —su `include` trae `src/**` con `types:["node"]`,
      # así que un `process.env` colado en `src/` le pasaría—, y el de arriba no
      # ve `test/` en absoluto.
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build

  ai-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pillow + httpx: deps ligeras de los tests de imagen y del adaptador de
      # sprite-forge. fastapi: lo usan test_spend_tracker y
      # test_sprite_forge_adapter (TestClient). numpy: lo importa
      # surface_atlas_generator.make_tileable, sujeto de test_surface_atlas.
      # El resto de la suite sigue siendo stdlib-only.
      #
      # uvicorn NO hace falta AQUÍ (#199): solo lo importan main.py y
      # remote_gen_main.py, que ningún test importa y que compileall compila
      # sin ejecutar. El job que SÍ arranca `main.py` —`candados-headless`, más
      # abajo— instala uvicorn y anthropic por su cuenta (#235). Ojo con quitar
      # de más: estos tests NO son skipUnless
      # salvo los de sprite-forge, así que una dep ausente los volvería
      # verdes y VACÍOS en vez de rojos — comparar el conteo, no el color.
      #
      # La geometría del atlas de repintado ya NO se prueba aquí: se fue con el
      # módulo a sprite-forge, y allí corre en su propio CI.
      - run: pip install ruff pillow httpx fastapi numpy
      - run: ruff check ai_server
      # labs/ no tiene tests ni lint (benches), pero compileall lo mantiene
      # al menos sintácticamente válido — es código que se retoma cada pocos
      # meses cuando avanza la tecnología de IA.
      - run: python -m compileall -q ai_server labs
      # NEFAN_SPEND_DIR: el ledger de gasto (`cache/spend/events.jsonl`) es
      # dinero, y la suite le añadía 43 eventos de gasto INVENTADO por corrida
      # (#392). La variable lo desplaza a un temporal; olvidarla no es verde,
      # `SpendTracker` se niega a construirse sobre la ruta real bajo test.
      - run: NEFAN_SPEND_DIR=$(mktemp -d) python -m unittest discover -s ai_server/tests

  # Los candados HEADLESS de `qa/` (#357, T11). Son los ejecutables sueltos de
  # `qa/*.mjs` que no abren navegador: levantan lo que necesitan en puertos que
  # elige el kernel, lo matan por PID y se ponen ROJOS por sí solos. Hasta esta
  # tanda el CI no tocaba `qa/` (cero menciones), y el 2026-09-05 uno de esos
  # candados llevaba un día rojo en `main` sin que nadie lo supiera. Un paso por
  # ejecutable, para que el rojo tenga nombre.
  #
  # LA REGLA QUE LA TANDA E TUVO QUE APRENDER MIRANDO ESTA LISTA —un ejecutable
  # headless NUEVO entra AQUÍ el día que nace, o no lo corre nadie— YA NO ES
  # PROSA (#645, tanda H): la sujeta
  # `nefan-core/test/candados-headless-totalidad.test.ts`, que exige que todo
  # `qa/*.mjs` esté en un paso de este job, o caiga por el GRAFO (su import
  # alcanza `playwright-core`, o spawnea `qa/run.mjs`: preset + Chromium), o
  # esté en `nefan-core/data/contract/candados-headless.json` con su motivo.
  # La lista de excepciones en prosa que vivía aquí se retira ENTERA en vez de
  # corregirse, y no por pereza: decía «los TRES que levantan asset-store o
  # sprite-forge» y eran cuatro (`qa/sprites-sin-servicio.mjs:300` arranca
  # sprite-forge). Dos listas de lo mismo divergen; una sola falla.
  candados-headless:
    runs-on: ubuntu-latest
    # El timeout no es un presupuesto: es que un candado que se quede esperando
    # un puerto no puede comerse el runner seis horas. El reloj medido de cada
    # paso está en su propio comentario, que es la única cifra que alguien
    # actualiza al tocarlo.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Los candados de mutación leen el tag `mutacion-ultima` del historial.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nefan-core/package-lock.json
            narrative-mcp/package-lock.json
      - run: npm ci
        working-directory: nefan-core
      - run: npm ci
        working-directory: narrative-mcp
      # El dist del core: los candados que cargan tests con `@nefan/core` lo
      # necesitan compilado, igual que el job `nefan-core`.
      - run: npm run build
        working-directory: nefan-core
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Aquí arranca el ai_server REAL (`main.py` → uvicorn) con el SDK REAL
      # (`anthropic`) apuntado al stub `labs/narrative/fake-anthropic.ts` por
      # `ANTHROPIC_BASE_URL`: por eso este job instala lo que `ai-server` no
      # necesita. La clave de API es falsa; no hay proveedor al que llamar.
      - run: pip install fastapi uvicorn anthropic httpx pillow numpy
      # (2 s) #235: un NPC con `role` y `description` atraviesa ai_server por
      # HTTP y llega al wire del bridge con los dos campos; rojo si una de las
      # dos copias de `validate_scene_response` desaparece. Necesita python3 con
      # `uvicorn` y `anthropic`, y el `dist` del core.
      - run: node qa/el-npc-cruza-ai-server-con-role-y-description.mjs
      # #453: el State API REAL (bridge + motor falso, disco efímero) rebota con
      # 409 cada mutadora del contrato sin partida, muta con 200 en la sesión
      # provisional y en disco, y contesta 500 «aplicado en memoria pero NO
      # guardado» cuando persistir falla — y lo comprueba contra la memoria y el
      # save. (2,4 s) Solo necesita node, tsx y el dist del core.
      - run: node qa/el-state-api-no-muta-sin-partida.mjs
      # #357: los candados en negativo SIN navegador, en este orden: primero el
      # que estaba rojo en `main`, luego el único que solo lee (`el-selector`),
      # después los que escriben en el árbol y restauran, y `contrato-` —que se
      # niega sobre SUS ficheros sucios— detrás de ellos. Los que escriben
      # restauran también con SIGINT/SIGTERM (130/143). Cada uno sale con 2 si
      # no puede medir; ninguno gasta un crédito. Tiempos medidos en local el
      # 2026-09-05 (Ryzen 7 5800X).
      #
      # (6,5 s) el reparto por reloj, la fusión de lotes y la procedencia de la
      # siembra. Estuvo ROJO en `main` del 04-09 al 05-09 sin que nadie lo
      # supiera —la población que daba por fija cambió con #440/#445—, y esa es
      # la razón de que este job exista.
      - run: node qa/mutacion-reparto-en-lotes.mjs --solo-vigentes
      # (2,6 s) cada dato que una batería abre selecciona a sus módulos (#404).
      - run: node qa/el-selector-ve-lo-que-la-bateria-abre.mjs
      # (~10 s) un fuente BORRADO solo se descarta cuando `antes` demuestra que
      # sus importadores están en el diff (#471): clon superficial en
      # `qa/.tmp/`, borrados y `git mv` con git real, y el mismo `afectado
      # --rango` que corre `pendiente`. Es el único candado con git real de
      # `--no-renames` y del reparto vivos/idos por `despues`. No toca el árbol.
      - run: node qa/el-borrado-pregunta-a-antes.mjs
      # (~10 s) un `node:*` que entra en el cliente A SALTOS, a través del core,
      # lo ve la regla `cierre` del checker con el colector REAL (#359): clon
      # superficial en `qa/.tmp/`, roturas escritas de verdad en ficheros del
      # core (dos y tres saltos, re-exportación, directorio, import roto,
      # `import()` dinámico, destino existente fuera del escaneo) y el mismo
      # `checkArchitecture(archConfig, loadArchFiles())` que corre `npm test`.
      # La batería del grafo es sintética; esto es lo que la une al disco.
      # No toca el árbol.
      - run: node qa/el-cierre-ve-el-node-a-saltos.mjs
      # (36 s) rompe `mutacion-huella.ts` y la huella y exige que su batería se
      # entere; restaura byte a byte.
      - run: node qa/mutacion-candados-en-negativo.mjs
      # (26 s) rompe `mutacion.ts`, `mutate.ts` y `mutation.yml` y ejerce el
      # VERBO real sobre un `reports/mutation/` de ensayo. Lee el tag
      # `mutacion-ultima` y su historia: de ahí el `fetch-depth: 0`.
      - run: node qa/mutacion-cableado-en-negativo.mjs
      # (0,7 s) la séptima condición del veredicto de adopción, en los DOS
      # sentidos (#599 + QA H-1/H-2). Entra porque la capa que IMPRIME ese
      # bloque no la miraba NADIE: QA borró el censo entero y el titular, y
      # `verify`, `candados` (50/50) y `cableado` (16/16) seguían verdes — con
      # ellos desaparecían el rótulo, el puntero a #598 y la lista de 43
      # ficheros de la que sale #598. Llama a las funciones reales con material
      # sintético y captura lo que imprimen; no toca `reports/` (su base de
      # ensayo vive en el temporal del sistema) y no gasta un crédito.
      - run: node qa/mutacion-la-septima-en-los-dos-sentidos.mjs
      # (3,5 s) rompe schemas y saneadores (TS con tsx, Python con
      # `python3 -m unittest`) y exige que sus tests se enteren.
      - run: node qa/contrato-candados-en-negativo.mjs
      # (0,2 s) los DOS gates de escena rebotan cada clave retirada con el mismo
      # texto (#466). Nació rojo con cinco divergencias medidas y entra aquí
      # verde; recorre los registros de los dos lados, así que una retirada
      # nueva entra sola. Necesita tsx (el zod) y las deps de ai_server que este
      # job ya instala (el saneador).
      - run: node qa/los-dos-gates-rebotan-igual.mjs
      # (45 s) la suite de ai_server no escribe el ledger de gasto REAL (#392);
      # spawnea `python3 -m unittest discover` con el entorno controlado.
      - run: node qa/el-ledger-de-gasto-no-lo-escribe-la-suite.mjs
      # Los tres de la GEOMETRÍA SÓLIDA, que hasta la tanda E (2026-09-16) no
      # corría nadie: no abren navegador, leen `dist` —que este job ya
      # construye— y medidos en un árbol limpio (`git archive` + build) tardan
      # 70, 264 y 200 ms. Su ausencia no estaba en la lista de excepciones de
      # arriba: simplemente nacieron fuera, que es como el 2026-09-05 un candado
      # pasó un día rojo en `main` sin que nadie se enterara.
      #
      # #489: la caja del jugador responde igual que la base para todo origen
      # EXTERIOR (1.440 sondas). Desde #601 ya no mira los interiores, y su
      # cabecera dice qué dejó de mirar.
      - run: node qa/equivalencia-de-cajas.mjs
      # #538: la consulta de solidez no vuelve a `puntoDeReaparicion`. El aserto
      # de ARIDAD no basta —`Function.length` no cuenta los parámetros con valor
      # por defecto, #614—, así que afirma que un argumento de más ni se llama
      # ni mueve el punto, y mide la equivalencia de la retirada en 99.932
      # puntos de las tres fixtures.
      - run: node qa/la-puerta-de-la-reaparicion.mjs
      # #583: un NPC no atraviesa lo que al jugador le frena, y al que le cae
      # una caja encima el sim le SACA. Monta el adapter de PRODUCCIÓN
      # (`createSessionNpcBehavior`) a propósito: construido a mano, cortar el
      # cable de `bridge/context.ts` dejaba la suite entera en verde (2891/2891)
      # con #583 revertido del todo.
      - run: node qa/el-mundo-solido-tambien-para-el-npc.mjs
      # (50 s) #616: de TODO punto sólido de las tres fixtures se sale andando,
      # con `pasoDelJugador` y el cableado ENTERO del cliente (frontera + suelo
      # + cajas). Entra AQUÍ el día que nace, que es la regla que la tanda E
      # tuvo que aprender mirando esta lista. Es el más lento de los headless y
      # se sabe por qué: 6.007 puntos × 36 rumbos a 60 fps, en dos pasadas. El
      # horizonte de la primera se deriva de una medida de penetración hecha
      # APARTE —no de la función que juzga, que es como su bloque 2 salía verde
      # con el defecto puesto (QA de G1)— y la segunda recoge a los 126 que
      # tienen que rodear porque su eje más corto da a un tile que no existe.
      - run: node qa/nadie-se-queda-encerrado.mjs
      # (16 s) QA de la PR G1 de #616: que el SUELO y el CABLEADO sobre los que
      # se afirma «de aquí se sale» sean los del cliente. Censo de quién
      # rasteriza el plan en `qa/` (el guion de arriba nació montando los
      # `volumes` DECLARADOS y medía 960 celdas de 1.608), y el `collidesAt`
      # ENTERO —frontera del plano + suelo + cajas— sobre las tres fixtures: con
      # las tres fuentes tampoco queda un punto sin salida, y 126 de 6.007
      # necesitan rodear porque el eje de menor penetración da a un tile que no
      # existe. Ese 126 lo mide y no lo afirma.
      - run: node qa/los-candados-miden-el-mundo-del-cliente.mjs
      # (0,18 s) #616, mitad de ARRIBA: el viaje por «Salidas» no vuelve a
      # difundir un punto de aparición que nadie ha mirado. Conduce el handler
      # REAL del bridge (`handlePlayerEnteredPlace`) con el proveedor de
      # colisión de producción sobre los 13 `building` de las fixtures, que hoy
      # están ocupados en su centro 13 de 13, y por los DOS caminos del spawn:
      # el lugar ya realizado y el viaje que GENERA el tile (el segundo lo pidió
      # H2 de la QA, midiendo que sin él media PR se revertía en verde). Entra
      # aquí el día que nace, que es la regla que la tanda E aprendió mirando
      # esta misma lista. Solo necesita el `dist` del core, que este job ya
      # construye.
      - run: node qa/el-viaje-no-mete-a-nadie-dentro.mjs
      # (0,2 s) #644: la consulta de PUNTO no tiene origen. Comprueba el CABLE
      # (`probePoint` → `ocupadoEn` → `suelo.ocupado` ∪ `aabbOcupa`, y que no
      # vuelva a apoyarse en `collidesAt`), la equivalencia con la consulta de
      # movimiento desde un origen libre sobre 48.387 puntos de las tres
      # fixtures, y el defecto REPRODUCIDO: la misma línea de 121 muestras
      # contada desde cuatro orígenes da cuatro números con `collidesAt` y uno
      # solo con `ocupadoEn`. Este paso lo PIDIÓ el candado de #645 —el
      # ejecutable nació fuera del job y `npm test` se puso rojo con su
      # nombre—, que es exactamente para lo que se escribió.
      - run: node qa/la-consulta-de-punto-no-tiene-origen.mjs
      # (0,42 s) #376/#652: el arte de personaje entra con procedencia y
      # pineado, y `hero` y `frames` se sueltan JUNTOS. Arranca el entry REAL
      # del asset-store como proceso hijo, con índice y blobs en `mkdtemp` y el
      # puerto que elija el kernel, así que no toca el índice del checkout —y lo
      # AFIRMA al final, que es lo que lo hace seguro aquí—. Entró el 2026-09-17
      # con lo único que le faltaba: la prueba en un clon LIMPIO (`git archive`
      # del árbol rastreado + `npm ci` + `npm run build`), que es la lección de
      # `fake-enruta-por-pathname` —verde en la máquina de quien lo escribió y
      # rojo en un árbol recién clonado, porque leía arte gitignored—.
      - run: node qa/el-arte-de-personaje-no-se-pina-a-medias.mjs
      # (0,81 s) #391/#652: el fail-loud del asset-store se ejerce SIN tocar el
      # índice del checkout — las tres variables mal puestas, que no llega a
      # escuchar, y que no deja basura en la raíz del repo (sin la guarda creaba
      # un fichero llamado dos espacios). Misma familia que el anterior y misma
      # prueba en clon limpio. OJO a lo que este job NO distingue: el guion se
      # niega con EXIT 2 si no encuentra el entry, y eso no es lo mismo que un
      # rojo; el candado de totalidad es estático y no puede verlo.
      - run: node qa/el-indice-del-store-se-prueba-sin-el-del-checkout.mjs
      # (0,6 s) #643: el rumbo de salida no lo frena la otra fuente. Es el
      # candado de un defecto VIVO y sin arreglar —decisión del usuario del
      # 2026-09-17, «candado sin tocar geometría»—, así que congela su TAMAÑO
      # (212 rumbos) en vez de exigir 0: la PR que lo mejore lo baja en su
      # propio diff y la que lo empeore no pasa. No afirma que nadie se quede
      # encerrado: eso nace VERDE (357/357 NPCs salen, medido por la crítica de
      # la tanda I) y habría sido el cuarto candado sin sujeto vivo en tres
      # tandas. Monta el proveedor de PRODUCCIÓN y clasifica los puntos con las
      # mismas dos mitades que compone `ocupado`, porque el primer intento
