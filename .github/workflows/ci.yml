name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nefan-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Alineado con engines (>=24): node:sqlite del asset-store (F2).
          node-version: 24
          cache: npm
          cache-dependency-path: nefan-core/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  narrative-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narrative-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            narrative-mcp/package-lock.json
            nefan-core/package-lock.json
      # La dependencia file:../nefan-core (F0) exige instalar las deps del
      # paquete enlazado; `npm run build` es `tsc -b`, que compila primero
      # nefan-core (project reference) y hace de typecheck (contract-check.ts
      # incluido) — sustituye al antiguo `npx tsc --noEmit`.
      - run: npm ci
        working-directory: nefan-core
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  nefan-html:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nefan-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nefan-html/package-lock.json
      # nefan-html importa tipos de nefan-core por ruta relativa — hace falta
      # instalar también las deps del core para que tsc/vite resuelvan.
      - run: npm ci
      - run: npm ci --prefix ../nefan-core
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  ai-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pillow + httpx: deps ligeras de los tests de sprite_skin_meshy
      # (atlas/keyframes). fastapi + uvicorn (F3): tests del proceso
      # gpu-worker (TestClient + dos workers reales en subprocesos). El resto
      # de la suite sigue siendo stdlib-only.
      - run: pip install ruff pillow httpx fastapi uvicorn
      - run: ruff check ai_server
      - run: python -m compileall -q ai_server
      - run: python -m unittest discover -s ai_server/tests
