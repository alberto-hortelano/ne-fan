name: Mutation testing

# La mutación se PIDE y la autoriza una persona. No hay cron.
#
# El cron estaba porque parecía la alternativa a que cada agente lanzara su
# tanda en la máquina de quien programa; pero una nocturna que mide cuatro PR
# juntas no sabe de cuál salió cada superviviente, y ese trabajo —averiguarlo a
# mano, después— es justo el que no se hace nunca. Aquí la corrida se lanza
# cuando alguien pulsa "Run workflow" (desde el navegador del móvil también), y
# vuelve con dueño: `npm run mutacion -- repartir` reparte cada hallazgo entre
# las PR del rango cuyo diff selecciona ese módulo.
#
# En su lugar, `npm run deuda` avisa cuando un módulo lleva demasiados días sin
# medida: sin nocturna, la única forma de que un módulo se quede años sin medir
# es que nadie lo mire, y eso lo mira el aviso.
on:
  workflow_dispatch:
    inputs:
      modulos:
        description: "vacío = lo que falta por medir desde el tag mutacion-ultima · TODOS = corrida completa · o ids de módulo separados por espacios"
        required: false
        default: ""

# Solo para reposicionar el tag `mutacion-ultima`. No se commitea nada: la
# huella la escribe `repartir` en la máquina de quien reparte y viaja en la PR,
# que es donde un delta se puede REVISAR.
permissions:
  contents: write

jobs:
  # ── 1 · PLANIFICAR ─────────────────────────────────────────────────────────
  # Decide QUÉ se mide, con qué ancla, y en cuántos trozos. Sube el plan como
  # artefacto propio ANTES de medir nada: es el único dato que después no se
  # puede reconstruir, y de él sale `modulos_pedidos` de la fusión.
  planificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nefan-core
    outputs:
      matriz: ${{ steps.lotes.outputs.matriz }}
      lotes: ${{ steps.lotes.outputs.lotes }}
      origen: ${{ steps.seleccion.outputs.origen }}
      desde: ${{ steps.seleccion.outputs.desde }}
    steps:
      - uses: actions/checkout@v7
        with:
          # OBLIGATORIO. Por defecto `checkout` clona con profundidad 1 y sin
          # tags: `mutacion-ultima`, `--rango`, `merge-base` y `blame` fallan
          # con "bad object". Y el fallo es del tipo caro — si alguien lo
          # capturara y lo degradara a "no ha cambiado nada", este workflow
          # saldría VERDE sin medir un solo mutante, que es la forma exacta del
          # fallo que `scripts/afectado.ts` describe en su cabecera. Sin esto el
          # paso de selección revienta, y así tiene que ser.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nefan-core/package-lock.json
      - run: npm ci

      # QUÉ SE MIDE. El input vacío no significa "todo": significa "lo que falta
      # por medir desde la última corrida", que es MÁS correcto que la unión de
      # lo que los agentes hubieran pedido — coge también las PR que nadie pidió
      # y los commits directos a main (11 de los últimos 40 no llevan `(#NNN)`).
      # Un rango que no selecciona nada NO se degrada a la corrida completa: el
      # paso falla, porque gastar runner midiendo cero es peor que decirlo.
      #
      # Y AQUÍ SE LEE EL ANCLA, antes de medir y en los tres orígenes: el sha del
      # tag `mutacion-ultima` tal y como está AHORA, que es el punto desde el que
      # esta corrida elige. Se lee una vez y viaja al plan y al manifiesto,
      # porque el último job de este mismo workflow adelanta el tag a
      # `$GITHUB_SHA`: quien reparta después leería un ancla que ya no es la de
      # esta corrida, el rango `tag..corrida.sha` saldría VACÍO por construcción
      # y los módulos saldrían «sin dueño» justo en la corrida que más tenía que
      # repartir (#381). El dato existía; lo único que se hacía con él era
      # tirarlo.
      - name: Qué hay que medir
        id: seleccion
        run: |
          DESDE="$(npm run --silent mutacion -- ancla)"
          echo "ancla del rango: $DESDE"
          echo "desde=$DESDE" >> "$GITHUB_OUTPUT"
          if [ "$MODULOS" = "TODOS" ]; then
            echo "origen=todos" >> "$GITHUB_OUTPUT"
            echo "ids=" >> "$GITHUB_OUTPUT"
          elif [ -n "$MODULOS" ]; then
            echo "origen=explicito" >> "$GITHUB_OUTPUT"
            echo "ids=$MODULOS" >> "$GITHUB_OUTPUT"
          else
            IDS="$(npm run --silent mutacion -- pendiente --ids)"
            echo "seleccionados: $IDS"
            echo "origen=rango" >> "$GITHUB_OUTPUT"
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Lo que escribe quien lanza el workflow viaja por variable de entorno
          # y no interpolado en el `run`: no entra en la línea de comandos.
          MODULOS: ${{ inputs.modulos }}

      # EL REPARTO EN LOTES, por SEGUNDOS MEDIDOS y por nada más. Un proxy
      # (mutantes, o mutantes x ficheros de batería) deja a `blueprint-derive`
      # —el módulo más caro, 1.647 s— séptimo de once, y el lote que se sale del
      # reloj es justo el suyo. Los módulos sin medida van solos, por la misma
      # razón por la que `permisoLocal` rechaza el coste desconocido.
      - name: Repartir en lotes
        id: lotes
        run: |
          # Con el input TODOS el selector no da ids: se pide la lista entera
          # del plan con `--todos`, EXPLÍCITO. Una lista vacía que alguien tenga
          # que interpretar como «todos» ya costó una corrida completa —el
          # `--pedidos ""` que mataba el manifiesto después de medir.
          if [ "$ORIGEN" = "todos" ]; then
            npm run --silent mutacion -- lotes --todos --origen "$ORIGEN" \
              --sha "$GITHUB_SHA" --desde "$DESDE" --run "$GITHUB_RUN_ID"
          else
            npm run --silent mutacion -- lotes --ids "$IDS" --origen "$ORIGEN" \
              --sha "$GITHUB_SHA" --desde "$DESDE" --run "$GITHUB_RUN_ID"
          fi
        env:
          IDS: ${{ steps.seleccion.outputs.ids }}
          ORIGEN: ${{ steps.seleccion.outputs.origen }}
          DESDE: ${{ steps.seleccion.outputs.desde }}

      # EL PLAN SUBE ANTES DE MEDIR, y en su propio artefacto. Es lo que hace
      # que un lote que muera entero —sin subir nada— siga dejando sus módulos
      # en `modulos_pedidos`: la fusión los cuenta como pedidos y sin informe,
      # el veredicto sale INCOMPLETA y el tag no se mueve. Si `modulos_pedidos`
      # se reconstruyera desde los lotes que llegaron, un lote muerto se llevaría
      # consigo tanto lo pedido como lo medido, las dos listas volverían a casar
      # y el tag se movería declarando medido lo que nadie midió.
      - uses: actions/upload-artifact@v7
        with:
          name: plan-corrida
          path: nefan-core/reports/plan-corrida.json

  # ── 2 · MEDIR (matriz) ─────────────────────────────────────────────────────
  medir:
    needs: planificar
    runs-on: ubuntu-latest
    # 45 = los 30 minutos de `tope_lote` más el arranque (checkout, npm ci,
    # dry-run) y margen sobre el día malo. El tope del lote está en
    # `mutation-targets.json` y es lo que `lotes` presupuesta; este número es su
    # red, no su fuente.
    timeout-minutes: 45
    strategy:
      # OBLIGATORIO. Sin esto, un lote que se cae cancela a los demás y se
      # pierden medidas ya hechas — el equivalente exacto de que `mutate.ts` no
      # corte en el primer módulo que baja de su break.
      fail-fast: false
      # Explícito, y se ajusta CON LA MEDIDA: el hueco entre `created_at` y
      # `started_at` de los jobs (`gh api …/actions/runs/<id>/jobs`) dice cuánto
      # espera en cola una PR normal mientras corre la matriz. Si pasa de 2
      # minutos, se baja. El reloj de la mutación es diferido; el de una PR no.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.planificar.outputs.matriz) }}
    defaults:
      run:
        working-directory: nefan-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nefan-core/package-lock.json
      - run: npm ci

      # El lote recibe sus ids POR LA MATRIZ y no bajando el plan: así un fallo
      # al descargar un artefacto no puede convertirse en un job que mide otra
      # cosa. El plan solo lo necesita `reunir`.
      - name: Medir el lote
        run: NEFAN_MUTATE_CONCURRENCY=$(( $(nproc) - 1 )) npm run mutate -- $IDS
        env:
          IDS: ${{ matrix.ids }}
          # El muro de `mutate.ts` se niega a correr sin esto. Aquí SÍ se pone,
          # y es la única razón por la que se pone: en el runner no hay nadie
          # delante cuya máquina se pueda saturar, y la corrida está autorizada
          # por la persona que pulsó «Run workflow».
          NEFAN_MUTATE_AUTORIZADO: "si"

      # EL MANIFIESTO PARCIAL LO ESCRIBE CI, no `traer`: `traer` solo puede
      # escribir lo que CREÍA que iba a pasar. `--pedidos` son los ids de ESTE
      # lote, y el sello de cada informe entra aquí; el cronómetro que dejó
      # `mutate.ts` en este mismo job viaja con él como `segundos`, que es de
      # donde saldrá el reparto de la próxima corrida.
      - name: Manifiesto del lote
        if: always()
        run: npm run --silent mutacion -- manifiesto --origen "$ORIGEN" --pedidos "$IDS" --sha "$GITHUB_SHA" --desde "$DESDE" --run "$GITHUB_RUN_ID"
        env:
          ORIGEN: ${{ needs.planificar.outputs.origen }}
          DESDE: ${{ needs.planificar.outputs.desde }}
          IDS: ${{ matrix.ids }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Un artefacto por lote. `reunir` los baja todos y `fusionar` los
          # junta en el ÚNICO `informe-mutacion` que `traer` conoce.
          name: informe-mutacion-${{ matrix.lote }}
          path: nefan-core/reports/mutation/

  # ── 3 · REUNIR ─────────────────────────────────────────────────────────────
  # `if: always()`: si un lote se cae, la fusión es MÁS necesaria, no menos —
  # es quien dice cuál se cayó y quien impide que el tag se mueva.
  reunir:
    needs: [planificar, medir]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nefan-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nefan-core/package-lock.json
      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          path: nefan-core/reports/lotes

      # Verifica el sello de cada informe contra su parcial ANTES de mezclarlo
      # —es lo que hace segura la fusión de N artefactos (#420)—, escribe UN
      # `corrida.json` cuyo `modulos_pedidos` sale del PLAN, y deja
      # `reports/mutation/` con la forma exacta que `traer` espera.
      - name: Fusionar los lotes
        id: fusion
        run: npm run --silent mutacion -- fusionar --entrada reports/lotes

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # El artefacto que baja `npm run mutacion -- traer`. Su forma no ha
          # cambiado con la matriz, y ese es el objetivo: `traer` y `repartir`
          # no se enteran de que la corrida vino partida.
          name: informe-mutacion
          path: nefan-core/reports/mutation/

      # El tag solo se mueve cuando la corrida puede DECLARAR medido todo lo que
      # había desde la anterior: origen `rango` o `todos`, y todos los módulos
      # pedidos con informe. Una lista explícita de módulos no mueve nada —
      # movería el tag declarando medido lo que nadie midió, y a partir de ahí
      # el agujero sería invisible.
      #
      # Y solo desde `main`. El tag dice hasta dónde se ha medido la historia de
      # main; ponerlo en un commit de una rama que aún no está mergeada deja el
      # rango `mutacion-ultima..main` calculado desde un punto que main no
      # contiene, y lo que se midió fue código que todavía no está ahí. El
      # motivo se IMPRIME en vez de saltarse el paso en silencio: un paso gris en
      # la UI no dice por qué.
      - name: Reposicionar mutacion-ultima
        if: always() && steps.fusion.outputs.mueve_tag == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "NO se mueve el tag: esta corrida midió $GITHUB_REF, no main."
            echo "Lo medido aún no está en la historia de main, así que el tag mentiría sobre el rango."
            exit 0
          fi
          git tag -f mutacion-ultima "$GITHUB_SHA"
          git push -f origin mutacion-ultima
          echo "mutacion-ultima → $GITHUB_SHA"
